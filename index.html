<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAFE MARCHE RYAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D6CDB2; --panel:#E9E3D0; --ink:#23261C; --muted:#5C5F4E; --line:#A99F82;
  --olive:#4B5320; --blood:#9E1B14; --ok:#3E6B2C; --warn:#B8860B; --btn:#F4F0E2; --ground:#CFC6A8;
  --lM:#B3261E; --lA:#2F6DB3; --lR:#1F8A87; --lC:#7A4FA0; --lH:#B7810F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1F231A; --panel:#2E3326; --ink:#ECE6D2; --muted:#AFA98F; --line:#555B45;
  --olive:#9AA65A; --blood:#E0473C; --ok:#8BC06A; --warn:#E0B24A; --btn:#383E2E; --ground:#353B2B;
  --lM:#E0473C; --lA:#5B9BE0; --lR:#3FBFBA; --lC:#A980CF; --lH:#E0B24A;}}
:root[data-theme="dark"]{
  --bg:#1F231A; --panel:#2E3326; --ink:#ECE6D2; --muted:#AFA98F; --line:#555B45;
  --olive:#9AA65A; --blood:#E0473C; --ok:#8BC06A; --warn:#E0B24A; --btn:#383E2E; --ground:#353B2B;
  --lM:#E0473C; --lA:#5B9BE0; --lR:#3FBFBA; --lC:#A980CF; --lH:#E0B24A;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:10px 14px 28px}
.stencil,h1{font-family:"Saira Stencil One",Impact,"Arial Narrow",sans-serif;font-weight:400}
h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.35rem;margin:0;line-height:1.1}
p{margin:0 0 10px}
.muted{color:var(--muted)}
/* tracker */
.tracker{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 8px}
.tracker div{position:relative;font-family:"Saira Stencil One",Impact,sans-serif;font-size:1.9rem;line-height:1.35;text-align:center;
  border:2px solid var(--line);border-radius:8px;color:var(--line);transition:background .3s,color .3s,border-color .3s}
.tracker div.now{border-color:var(--c);color:var(--c)}
.tracker div.done{background:var(--c);border-color:var(--c);color:#fff;animation:pop .35s}
@keyframes pop{50%{transform:scale(1.15)}}
/* vitals */
.vitals{display:flex;align-items:center;gap:10px;font-family:"Barlow Condensed",sans-serif;font-weight:700}
.heart{width:26px;height:26px;color:var(--blood);animation:beat var(--dur,.75s) infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(.95)}}
.bar{flex:1;height:14px;background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--ok);transition:width .25s linear,background .3s}
.bpm{min-width:4.2em;text-align:right;font-size:1.05rem}
/* scene */
.scene{position:relative;display:grid;grid-template-columns:150px 1fr;gap:12px;margin:10px 0;padding:10px 12px 10px 6px;
  border-radius:10px;border:1px solid var(--line);
  background:radial-gradient(circle at 25% 60%,color-mix(in srgb,var(--ground) 70%,var(--panel)) 0 35%,var(--panel) 75%)}
.fig{width:150px;height:auto;display:block}
.phase{display:inline-block;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:.85rem;color:#fff;background:var(--blood);padding:1px 8px;border-radius:4px;margin-bottom:6px}
.ctx{font-size:.95rem;margin:6px 0 8px}
.inj{list-style:none;padding:0;margin:0;display:grid;gap:5px}
.inj li{font-size:.9rem;font-weight:500;line-height:1.25;display:flex;gap:6px;align-items:flex-start}
.badge{flex:none;display:grid;place-items:center;width:1.35em;height:1.35em;border-radius:50%;background:var(--ink);color:var(--panel);font-size:.75em;font-weight:700;margin-top:.1em}
.dot{flex:none;width:1.35em;text-align:center;color:var(--muted)}
.ring{transform-box:fill-box;transform-origin:center;animation:ping 1.1s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.85}to{transform:scale(2.6);opacity:0}}
.pop-in{transform-box:fill-box;transform-origin:center;animation:popin .35s ease-out}
@keyframes popin{from{transform:scale(.3);opacity:0}}
/* feedback */
.fb{display:flex;gap:8px;align-items:flex-start;min-height:3em;font-weight:500;font-size:.95rem;padding:8px 12px;border-radius:8px;margin-bottom:10px;border:1px dashed var(--line)}
.fb.good{background:color-mix(in srgb,var(--ok) 20%,transparent);border:1px solid var(--ok)}
.fb.bad{background:color-mix(in srgb,var(--blood) 18%,transparent);border:1px solid var(--blood)}
/* actions */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.act{display:flex;gap:9px;align-items:center;background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:62px;
  text-align:left;font-weight:600;font-size:.93rem;line-height:1.2;box-shadow:0 2px 0 var(--line)}
.act:active{transform:translateY(2px);box-shadow:none}
.act svg{flex:none;width:30px;height:30px;padding:4px;border-radius:7px;background:var(--panel);color:var(--olive);
  fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act:disabled{opacity:.35;text-decoration:line-through;cursor:default;box-shadow:none}
.act.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0}
#flash.bad{animation:flash .45s;box-shadow:inset 0 0 0 10px var(--blood),inset 0 0 60px color-mix(in srgb,var(--blood) 50%,transparent)}
#flash.good{animation:flash .45s;box-shadow:inset 0 0 0 6px var(--ok)}
@keyframes flash{from{opacity:1}to{opacity:0}}
.primary{display:block;width:100%;background:var(--olive);color:var(--panel);border:0;border-radius:10px;
  padding:15px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.25rem;margin-top:14px}
button:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
/* intro */
.hero{display:grid;grid-template-columns:1fr 130px;align-items:center;gap:8px;margin-top:10px}
.big{font-family:"Saira Stencil One",Impact,sans-serif;font-size:clamp(3.2rem,17vw,4.6rem);line-height:.9;margin:0}
.big span{display:block}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:14px 0;align-items:center}
.legend b{font-family:"Saira Stencil One",Impact,sans-serif;font-weight:400;font-size:1.5rem;color:var(--c);line-height:1}
.debrief{padding-left:0;list-style:none;margin:8px 0 0}
.debrief li{display:flex;gap:10px;margin:8px 0;align-items:flex-start}
.debrief .l{flex:none;font-family:"Saira Stencil One",Impact,sans-serif;color:#fff;background:var(--c);border-radius:5px;width:1.6em;text-align:center}
.score{font-family:"Saira Stencil One",Impact,sans-serif;font-size:3.2rem;line-height:1;margin:6px 0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.9rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0}
.endgrid{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center}
.note{font-size:.82rem;color:var(--muted);margin-top:16px}
.scene{grid-template-columns:178px 1fr!important;padding:8px 10px 8px 4px!important}
.fig.play{width:172px}
.viewbtn{display:block;width:100%;margin-top:6px;background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:7px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1rem}
.side h2{font-size:1.2rem}
.side .ctx{font-size:.88rem}
.side h3{font-family:"Barlow Condensed",sans-serif;font-size:.95rem;margin:8px 0 4px;color:var(--muted);font-weight:700}
.inj li.done span:last-child{text-decoration:line-through;opacity:.6}
.inj li.new{animation:pop .5s}
.fb.warn{background:color-mix(in srgb,var(--warn) 25%,transparent);border:1px solid var(--warn)}
.fb.info{background:var(--panel);border:1px solid var(--line)}
.coverbtn{display:block;width:100%;background:var(--blood);color:#fff;border:0;border-radius:10px;padding:13px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.2rem;margin-bottom:10px}
.kit{position:sticky;bottom:0;z-index:5;display:flex;gap:7px;overflow-x:auto;background:var(--bg);margin:0 -14px;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);scrollbar-width:none}
.kit::-webkit-scrollbar{display:none}
.tool{flex:none;width:80px;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:6px 3px;font-size:.7rem;font-weight:600;line-height:1.1;text-align:center;hyphens:auto}
.tool svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--olive)}
.tool.sel{background:var(--olive);border-color:var(--olive);color:var(--panel)}
.tool.sel svg{color:var(--panel)}
.hint{font-size:.85rem;color:var(--muted);margin:0 0 6px}
.figs2{display:flex;gap:6px;justify-content:center}
.figs2 .fig{width:120px}
.tag{font-size:.75rem;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:4px;white-space:nowrap}
.tag.found{background:var(--ok);color:#fff}.tag.miss{background:var(--blood);color:#fff}
.tracker2{display:flex;gap:10px;margin:6px 0 8px;justify-content:space-between}
.tracker2 .grp{display:flex;flex-direction:column;gap:2px;flex:var(--n)}
.tracker2 .gl{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:.72rem;color:var(--muted)}
.tracker2 .gl.on{color:var(--ink)}
.tracker2 .ls{display:flex;gap:3px}
.tracker2 .ls div{flex:1;font-family:"Saira Stencil One",Impact,sans-serif;font-size:1.15rem;line-height:1.5;text-align:center;border:2px solid var(--line);border-radius:6px;color:var(--line);transition:background .3s,color .3s}
.tracker2 .ls div.now{border-color:var(--c);color:var(--c)}
.tracker2 .ls div.done{background:var(--c);border-color:var(--c);color:#fff;animation:pop .35s}
.curstep{font-size:.9rem;margin:-2px 0 6px}
.curstep b{font-family:"Barlow Condensed",sans-serif;font-size:1rem}
.choice{background:var(--panel);border:2px solid var(--c,var(--olive));border-radius:10px;padding:10px 12px;margin-bottom:10px}
.choice h3{margin:0 0 8px;font-family:"Barlow Condensed",sans-serif;font-size:1.05rem}
.choice .opts{display:grid;gap:7px}
.choice button{background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:11px 12px;text-align:left;font-weight:600;box-shadow:0 2px 0 var(--line)}
.choice button:active{transform:translateY(2px);box-shadow:none}
.choice button:disabled{opacity:.4;text-decoration:line-through}
.cnt{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.cnt button{display:flex;flex-direction:column;align-items:center;padding:8px 4px!important;text-align:center!important}.cnt strong{font-family:"Saira Stencil One",Impact,sans-serif;font-weight:400;font-size:1.6rem;line-height:1.1}.cnt span{font-size:.75rem;color:var(--muted)}
.choice button.msel{border:2px solid var(--olive);background:color-mix(in srgb,var(--olive) 14%,var(--btn))}
.learn{background:color-mix(in srgb,#F2C94C 16%,var(--panel));border:1px solid #d4ab2c;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:.92rem}
.learn p{margin:0 0 6px}.learn.compact{padding:8px 10px}.learn .tip{font-weight:600}
.lrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lrow button{background:#F2C94C;color:#222;border:0;border-radius:8px;padding:8px 12px;font-weight:700}
.lrow label{display:flex;gap:6px;align-items:center;font-weight:600}
.hintz{animation:hintz 1s ease-in-out infinite}@keyframes hintz{50%{fill-opacity:.05;stroke-opacity:.4}}
.tool.hint,.choice button.hint,.viewbtn.hint{box-shadow:0 0 0 3px #F2C94C;animation:hintp 1s ease-in-out infinite}
@keyframes hintp{50%{box-shadow:0 0 0 6px rgba(242,201,76,.35)}}
.langbtn{float:right;margin-top:8px;background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-weight:700;color:var(--ink)}
.grpt{font-family:"Saira Stencil One",Impact,sans-serif;font-size:1.1rem;margin:10px 0 2px}
.stage{position:relative;overflow:hidden;border-radius:9px;border:1px solid rgba(0,0,0,.25);box-shadow:inset 0 0 18px rgba(0,0,0,.25)}
.env-forest{background:radial-gradient(ellipse at 50% 100%,rgba(0,0,0,.25),transparent 55%),radial-gradient(circle at 15% 20%,#8f955f 0 3px,transparent 4px),radial-gradient(circle at 80% 35%,#7d8452 0 2px,transparent 3px),radial-gradient(circle at 30% 70%,#8a9058 0 2.5px,transparent 3.5px),radial-gradient(circle at 85% 80%,#747b4a 0 3px,transparent 4px),linear-gradient(180deg,#a7a57a,#8a8a5d);background-size:auto,40px 40px,34px 34px,46px 46px,38px 38px,auto}
.env-urban{background:radial-gradient(ellipse at 50% 100%,rgba(0,0,0,.25),transparent 55%),repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 1px,transparent 1px 30px),repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 1px,transparent 1px 44px),linear-gradient(180deg,#aca79c,#8e897f)}
.env-fire{background:radial-gradient(ellipse at 50% 100%,rgba(0,0,0,.3),transparent 55%),radial-gradient(circle at 25% 30%,#9b8d6c 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,#8d7f60 0 2.5px,transparent 3.5px),linear-gradient(180deg,#b3a37f,#8f8061);background-size:auto,36px 36px,44px 44px,auto}
.env-fire::after{content:"";position:absolute;inset:-30%;pointer-events:none;background:radial-gradient(circle at 20% 25%,rgba(70,70,70,.32),transparent 22%),radial-gradient(circle at 65% 15%,rgba(110,110,110,.28),transparent 20%),radial-gradient(circle at 45% 55%,rgba(80,80,80,.18),transparent 28%);animation:smoke 10s ease-in-out infinite alternate}
@keyframes smoke{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
.breath{transform-box:fill-box;transform-origin:50% 90%;animation:breathe var(--br,3.2s) ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.03,1.012)}}
.drip{animation:drip 1.3s ease-in infinite}.drip.d2{animation-delay:.65s}
@keyframes drip{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(16px);opacity:0}}
.bub{transform-box:fill-box;animation:bub 1.6s ease-out infinite}.bub.b2{animation-delay:.8s}
@keyframes bub{0%{transform:translate(0,0) scale(.5);opacity:0}30%{opacity:.9}100%{transform:translate(3px,-9px) scale(1.3);opacity:0}}
.zz{animation:zz 2.4s ease-in-out infinite}@keyframes zz{0%{transform:translate(0,4px);opacity:0}40%{opacity:1}100%{transform:translate(4px,-6px);opacity:0}}
.vein{animation:vein .8s ease-in-out infinite}@keyframes vein{50%{stroke-width:3.4}}
.tqIn .band{transform-box:fill-box;transform-origin:center;animation:band .35s ease-out}@keyframes band{from{transform:scaleX(1.4);opacity:0}}
.wind{transform-box:fill-box;transform-origin:center;animation:wind .8s cubic-bezier(.3,1.4,.5,1)}@keyframes wind{from{transform:rotate(-270deg)}}
.unfold{transform-box:fill-box;transform-origin:50% 0;animation:unfold .8s cubic-bezier(.2,.8,.2,1)}@keyframes unfold{from{transform:scaleY(.04);opacity:.3}}
.slideIn{transform-box:fill-box;transform-origin:center;animation:slideIn .5s ease-out}@keyframes slideIn{from{transform:scaleX(.1);opacity:0}}
.shimmer{animation:shim 2.6s ease-in-out infinite}@keyframes shim{50%{opacity:.15}}
.tap{transform-box:fill-box;transform-origin:center;animation:tap .55s ease-out forwards;fill:none;stroke:#fff;stroke-width:1.6}@keyframes tap{from{transform:scale(.4);opacity:1}to{transform:scale(2.6);opacity:0}}
.snd{background:none;border:1px solid var(--line);border-radius:6px;padding:0 8px;font-size:.95rem;line-height:1.6}
.fig.play{width:176px}

/* ---- écran de jeu plein écran ---- */
.play .curstep{font-size:.78rem;margin:0;line-height:1.2}
body.inplay{height:100%;overflow:hidden}
body.inplay main{height:100%;display:flex;flex-direction:column;padding:6px 10px 0;gap:5px}
.topbar{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);flex:none}
.topbar .sp{flex:1}
.topbar button{white-space:nowrap;background:var(--btn);border:1px solid var(--line);border-radius:7px;padding:3px 9px;font-size:.85rem;font-weight:700;color:var(--ink)}
.topbar button.on{background:#F2C94C;border-color:#d4ab2c;color:#222}
.play .tracker2{margin:0;gap:6px;flex:none}
.play .tracker2 .gl{font-size:.62rem;line-height:1}
.play .tracker2 .ls div{font-size:.95rem;line-height:1.45;border-width:1.5px;border-radius:5px}
.play .vitals{flex:none;font-size:.85rem;gap:8px}
.play .heart{width:18px;height:18px}.play .bar{height:9px}
.mid{flex:1;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:100%;gap:8px}
.mid .stage{height:100%;aspect-ratio:120/262;max-width:62vw}
.mid .stage svg{width:100%;height:100%;display:block}
.flipbtn{position:absolute;left:5px;bottom:5px;z-index:2;background:rgba(244,240,226,.92);color:#222;border:1px solid rgba(0,0,0,.3);border-radius:18px;padding:5px 10px;font-weight:700;font-size:.82rem}
.side2{overflow-y:auto;min-height:0;padding-right:2px}
.side2 h2{font-size:1.1rem}
.side2 .ctx{font-size:.84rem;margin:4px 0 6px}
.side2 h3{font-family:"Barlow Condensed",sans-serif;font-size:.85rem;margin:6px 0 3px;color:var(--muted);font-weight:700}
.side2 .inj li{font-size:.82rem}
.side2 .phase{font-size:.75rem;margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:4px}.chip{font-size:.72rem;font-weight:700;padding:2px 6px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}.chip.on{background:#2f8a22;border-color:#2f8a22;color:#fff}
.expl{font-size:.8rem;background:color-mix(in srgb,#F2C94C 16%,var(--panel));border:1px solid #d4ab2c;border-radius:8px;padding:6px 8px;margin-bottom:6px}
.bottom{flex:none;display:flex;flex-direction:column;gap:5px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.play .fb{min-height:0;max-height:4.3em;overflow-y:auto;margin:0;font-size:.84rem;padding:6px 10px;line-height:1.3}
.tipline{font-size:.84rem;font-weight:600;background:color-mix(in srgb,#F2C94C 22%,var(--panel));border:1px solid #d4ab2c;border-radius:8px;padding:6px 10px;max-height:4.3em;overflow-y:auto;line-height:1.3}
.play .choice{margin:0;padding:7px 8px}
.play .choice h3{font-size:.9rem;margin:0 0 5px}
.play .choice .opts{grid-template-columns:1fr 1fr;gap:6px}
.play .choice button{padding:8px;font-size:.82rem;line-height:1.2}
.play .kit{position:static;margin:0 -10px;padding:6px 10px 0;border-top:1px solid var(--line)}
.play .tool{width:70px;padding:5px 2px;font-size:.64rem}
.play .tool svg{width:22px;height:22px}
@media (max-width:360px){.scene{grid-template-columns:140px 1fr!important}.fig.play{width:140px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="flash"></div>
<main id="app"></main>
<script>
const ORDER=["sS","sA","sF","sE","M","A","R","C","H","E","rR","rY","rA","rN"];
const GROUPS=[["SAFE",["sS","sA","sF","sE"]],["MARCHE",["M","A","R","C","H","E"]],["RYAN",["rR","rY","rA","rN"]]];
const LBL={sS:"Stop the burning process (faire cesser le danger)",sA:"Assess the scene (évaluer la situation)",sF:"Free of danger (soustraire au danger)",sE:"Evaluate (premier bilan)",
 M:"Hémorragie massive",A:"Voies aériennes",R:"Respiration",C:"Choc / circulation",H:"Hypothermie / tête",E:"Évacuation",

iption…":"Joining…","✗ Code de classe inconnu.":"✗ Unknown class code.","⏳ Inscrit, synchronisation en attente (pas de connexion)":"⏳ Joined, sync pending (no connection)","🌐 Classe":"🌐 Class","synchronisation en attente":"sync pending","résultats envoyés automatiquement":"results sent automatically","Code de classe à donner aux élèves :":"Class code to give to students:","Clé formateur (pour retrouver la classe sur un autre téléphone) :":"Instructor key (to recover the class on another phone):","📤 Partager le code":"📤 Share the code","↻ Actualiser":"↻ Refresh","Chargement…":"Loading…","Rejoins ma classe SAFE MARCHE RYAN : entre le code":"Join my SAFE MARCHE RYAN class: enter the code","dans le champ « Code de classe » de l'appli.":"in the \"Class code\" field of the app.","✓ Message copié.":"✓ Message copied.","élèves":"students","mis à jour à":"updated at","Aucun élève pour l'instant. Partage le code de classe.":"No students yet. Share the class code.","Accès refusé à cette classe.":"Access to this class denied.","Pris en charge":"Managed",": ici,":": here,","»":"\"","«":"\"","📤 Envoyer à mon formateur":"📤 Send to my instructor","sur le mannequin. Fais un vrai balayage et retourne le blessé : certaines blessures sont cachées, et la réévaluation peut en faire apparaître de nouvelles.": "on the mannequin. Do a real sweep and roll the casualty over: some wounds are hidden, and reassessment can reveal new ones.", "Viscères couverts par un pansement humide non adhérent, sans comprimer ni réintégrer. Jambes fléchies, rien à boire, surveillance du choc.": "Bowel covered with a moist non-adherent dressing, without compressing or pushing it back. Knees bent, nothing by mouth, monitor for shock.", "Doctrine française SAFE MARCHE RYAN. SC1 pour tout combattant, SC2 pour l'auxiliaire sanitaire, SC3 pour le personnel médical.": "French SAFE MARCHE RYAN doctrine. SC1 for every soldier, SC2 for the combat medic assistant, SC3 for medical personnel.", "Outil d'entraînement au raisonnement. Ne remplace pas une formation SC1 / SC2 / TCCC encadrée, ni les protocoles de ton unité.": "A decision-making training tool. It does not replace supervised SC1 / SC2 / TCCC training or your unit's protocols.", "Ce jeu s'appuie sur ces doctrines. En cas de différence, ce sont les protocoles de ta formation et de ton unité qui priment.": "This game is based on these doctrines. If anything differs, your course and unit protocols take precedence.", "Adaptation civile du TCCC (forces de l'ordre, secours, tueries de masse) : Direct Threat, Indirect Threat, Evacuation Care.": "Civilian adaptation of TCCC (law enforcement, EMS, mass casualty attacks): Direct Threat, Indirect Threat, Evacuation Care.", "Référence militaire internationale : Care Under Fire, Tactical Field Care, Tactical Evacuation Care, algorithme MARCH PAWS.": "International military reference: Care Under Fire, Tactical Field Care, Tactical Evacuation Care, MARCH PAWS algorithm.", "Garrot sur l'avant-bras gauche. L'éviscération impressionne, mais elle ne tue pas aussi vite que cette hémorragie.": "Tourniquet on the left forearm. The evisceration looks dramatic, but it doesn't kill as fast as this bleed.", "Sous la plaie, il n'arrête pas un saignement qui vient du cœur : le sang continue de couler. Il se pose au-dessus.": "Below the wound it can't stop blood coming from the heart: the bleeding continues. It goes above.", "Avant de toucher le blessé : faire cesser le danger, évaluer la situation, soustraire au danger, premier bilan.": "Before touching the casualty: stop the threat, assess the scene, move to safety, first evaluation.", "Une compresse sèche colle aux intestins et les lèse au retrait : le pansement doit être humide et non adhérent.": "A dry gauze sticks to the bowel and damages it on removal: the dressing must be moist and non-adherent.", ", les os empêchent de comprimer l'artère : le garrot est inefficace. Décale-le au-dessus de l'articulation.": ", the bones prevent compressing the artery: the tourniquet won't work. Move it above the joint.", "Pneumothorax sous tension : « Exsufflation » sur le thorax atteint (d'abord décoller un bord du pansement).": "Tension pneumothorax: \"Decompression\" on the injured chest (first burp the seal by lifting one edge).", "Pas de chrono, pas de pénalité sur l'état du blessé. Explications à chaque étape et indices à la demande.": "No timer, no penalty on the casualty's condition. Explanations at every step and hints on demand.", "Sur la plaie, le garrot ne comprime pas l'artère en amont : le saignement continue. Remonte-le au-dessus.": "Over the wound, the tourniquet doesn't compress the artery upstream: the bleeding continues. Move it higher.", "Chercher et stopper toute hémorragie massive : balayage des 4 membres, aisselles, aines, sous le gilet.": "Find and stop any massive bleeding: sweep all 4 limbs, armpits, groin, under the vest.", "Jamais réintégrer les viscères : risque d'infection grave et de lésions. On les couvre là où ils sont.": "Never push the bowel back in: risk of severe infection and injury. Cover it where it is.", "Posé haut et serré : le bon réflexe sous le feu ou si la plaie est mal localisée. À réévaluer ensuite.": "Applied high and tight: the right reflex under fire or when the wound is hard to locate. Reassess later.", "Suspicion de pneumothorax sous tension : décoller un bord du pansement (burp), exsufflation si formé.": "Suspected tension pneumothorax: burp the seal by lifting one edge, needle decompression if trained.", "Balayage : outil « Examiner » sur chaque membre en surbrillance. Des blessures peuvent être cachées.": "Sweep: \"Examine\" tool on each highlighted limb. Wounds may be hidden.", "Posé 5 à 8 cm au-dessus de la plaie, hors articulation : la position de référence une fois à l'abri.": "Applied 2–3 inches (5–8 cm) above the wound, not over a joint: the standard position once under cover.", "Après une explosion, un blessé est au sol, inconscient. Il reste peut-être des engins non explosés.": "After an explosion, a casualty is lying on the ground, unconscious. There may be unexploded devices nearby.", "Plaie trop proche du tronc (zone jonctionnelle) : garrot impossible, fais un méchage + compression.": "Wound too close to the torso (junctional area): no tourniquet possible, pack the wound and apply pressure.", "Couvre avec un pansement humide non adhérent, sans comprimer, et ne réintègre jamais les viscères.": "Cover with a moist non-adherent dressing, without compressing, and never push the bowel back in.", "Urgence relative : blessé stable, on ne sature pas les moyens d'évacuation. En attendant : RYAN.": "Routine priority: stable casualty, don't overload evacuation assets. While waiting: RYAN.", "Colle ici le message reçu de l'élève (bouton « Envoyer à mon formateur » dans sa progression).": "Paste the message received from the student here (\"Send to my instructor\" button in their progress).", "Faire cesser ce qui fait des victimes : riposter, neutraliser la menace ou écarter le danger.": "Stop whatever is causing casualties: return fire, neutralise the threat or remove the danger.", "Pas de compression sur des viscères : ça les abîme et aggrave l'état. On couvre sans serrer.": "No pressure on exposed bowel: it damages it and makes things worse. Cover without tightening.", "Analgésie selon ton protocole et tes compétences : la douleur aggrave le stress et le choc.": "Pain management according to your protocol and skills: pain worsens stress and shock.", "Retourne le blessé (bouton ↻), puis « Examiner » sur le dos : cherche un orifice de sortie.": "Roll the casualty over (↻ button), then \"Examine\" the back: look for an exit wound.", "Soins complémentaires : pansements, éviscération, attelles, fiche de l'avant, surveillance.": "Additional care: dressings, evisceration, splints, casualty card, monitoring.", "Fiche de l'avant remplie (heures, gestes, constantes). Surveillance jusqu'à l'évacuation.": "Casualty card filled in (times, interventions, vitals). Monitoring until evacuation.", "Le protocole complet du sauvetage au combat, du premier coup de feu jusqu'à l'évacuation.": "The complete French combat casualty care protocol, from the first shot to evacuation.", "Une grenade a explosé à distance. Un équipier se plaint du bras gauche et de l'œil droit.": "A grenade exploded some distance away. A teammate complains about his left arm and right eye.", "Réexaminer chaque soin posé : un garrot peut lâcher, un pansement peut ne plus suffire.": "Re-check every intervention: a tourniquet can loosen, a dressing may no longer be enough.", "Ton binôme est touché pendant un échange de tirs. Il crie et se tient la cuisse droite.": "Your buddy is hit during a firefight. He's shouting and holding his right thigh.", "Vérifier que l'air passe. S'il parle, c'est bon. Inconscient qui ronfle : canule + PLS.": "Make sure air gets through. If he talks, it's fine. Unconscious and snoring: NPA + recovery position.", "Outil « Examiner » sur la tête : est-ce qu'il parle, est-ce qu'il respire bruyamment ?": "\"Examine\" tool on the head: is he talking, is his breathing noisy?", "Un équipier a chuté d'environ 6 mètres depuis un toit. Il se plaint surtout du bassin.": "A teammate fell about 6 metres (20 ft) from a roof. He mainly complains about his pelvis.", "Cours certifiants TCCC (militaires) et TECC (civils) dispensés dans de nombreux pays.": "Certified TCCC (military) and TECC (civilian) courses taught in many countries.", "Heure de pose notée : l'équipe médicale doit savoir depuis quand le garrot est serré.": "Time of application written down: the medical team needs to know how long the tourniquet has been on.", "Deuxième garrot sur la jambe gauche. Invisible de face : seul le balayage la révèle.": "Second tourniquet on the left leg. Invisible from the front: only the sweep reveals it.", "Décoller un bord du pansement (burp), puis exsufflation à l'aiguille si tu es formé.": "Burp the seal by lifting one edge, then  good(w.ok+(msg?" "+msg:""),t==="tq"?"tq":w.i);if(["tq","dress","splint","belt","pack"].includes(t))SFX.velcro();

  if(r.ok){const j=await r.json();a={uid:j.user_id,tok:j.id_token,rt:j.refresh_token,exp:Date.now()+(+j.expires_in)*1000};svj("march_fb",a);return a}}catch(e){throw e}}

 <div class="card"><h2>Blessures</h2><ul class="debrief">${F.w.map(w=>`<li><span class="l" style="--c:${LC[WL[w.tool]]}">${CH(WL[w.tool])}</span><span><strong>${w.label}</strong>${w.hidden?`<span class="tag ${st.w[w.i].rev?"found":"miss"}">${st.w[w.i].rev?"cachée, trouvée":"cachée, manquée"}</span>`:""}${w.ev?`<span class="tag found">réévaluation</span>`:""}<br><span class="muted">${w.ok}</span>${TREF[w.tool]?`<br><span style="font-size:.78rem;color:var(--olive);font-weight:600">📚 ${TREF[w.tool]}</span>`:""}</span></li>`).join("")}</ul></div>
 <div class="card"><h2>La bonne séquence</h2>${steps.map(([g,l])=>`<p class="grpt">${g}</p><ol class="debrief">${l.map(([k,t])=>`<li><span class="l" style="--c:${LC[k]}">${CH(k)}</span><span>${t}</span></li>`).join("")}</ol>`).join("")}</div>
 <p class="note" style="margin:0 0 4px">Sources : SSA (sauvetage au combat), CoTCCC (TCCC Guidelines), C-TECC. <a href="#" id="rf" style="color:var(--olive);font-weight:700">Voir les références</a></p>
 <button class="primary" id="nx">${cur+1<order.length?"Blessé suivant":"Voir le bilan"}</button>`;
 {const rf=document.getElementById("rf");const html=app.innerHTML;rf.onclick=e=>{e.preventDefault();const snap=app.innerHTML;refsScreen(()=>{app.innerHTML=snap;document.getElementById("nx").onclick=()=>{cur++;cur<order.length?start():final()};document.getElementById("rf").onclick=ev=>{ev.preventDefault();rf.onclick(ev)}})}}
 window.scrollTo(0,0);
 document.getElementById("nx").onclick=()=>{cur++;cur<order.length?start():final()};
}
function final(){lastScreen=null;
 document.body.classList.remove("inplay");
 const b=best(),rec=!LEARN()&&total>b;if(rec)best(total);
 {const p=me(),el={};results.forEach(r=>Object.entries(r.errL||{}).forEach(([k,v])=>el[k]=(el[k]||0)+v));
  p.h.push({d:Math.round(Date.now()/60000),m:MODE,s:LEARN()?0:total,ok:results.filter(r=>r.ok).length,n:results.length,hf:results.reduce((a,r)=>a+r.found,0),ht:results.reduce((a,r)=>a+r.hid,0),hi:results.reduce((a,r)=>a+(r.hints||0),0),er:results.reduce((a,r)=>a+(r.err||0),0),au:results.some(r=>r.auto),el});p.h=p.h.slice(-20);if(p.cls)p.cls.dirty=true;svj("march_profile",p);if(p.cls)syncMe()}
 const th=results.reduce((a,r)=>a+(r.hints||0),0),saved=results.filter(r=>r.ok).length,hf=results.reduce((a,r)=>a+r.found,0),ht=results.reduce((a,r)=>a+r.hid,0);
 app.innerHTML=`<h1 class="big" style="font-size:3rem;margin-top:14px">Bilan</h1><div class="score">${LEARN()?"":total}</div>
 <p class="muted">Mode ${MODES[MODE].t}. ${saved} / ${results.length} blessés pris en charge, ${hf} / ${ht} blessures cachées trouvées${th?`, aide utilisée ${th} fois`:", sans aide"}. ${LEARN()?"":rec?"Nouveau record.":"Record : "+b}</p>
 <div class="card"><ul class="debrief">${results.map(r=>`<li><span class="l" style="--c:${r.ok?"var(--ok)":"var(--blood)"}">${r.ok?"✓":"✗"}</span><span>${r.title} : ${LEARN()?(r.ok?"pris en charge":"perdu"):r.ok?r.pts+" pts":"perdu"}${r.hints?` · 💡 aidé ${r.hints}×`:""}</span></li>`).join("")}</ul></div>
 <button class="primary" id="re">Rejouer une série</button><button class="primary" id="pg" style="background:var(--btn);color:var(--ink);border:1px solid var(--line)">📈 Ma progression / envoyer au formateur</button>`;
 document.getElementById("pg").onclick=progress;
 document.getElementById("re").onclick=intro;
}
/* ---------- code d'accès ---------- */
const CODES=["fdc422fd"];
const hashCode=s=>{let x=0x811c9dc5;for(const c of s){x^=c.charCodeAt(0);x=Math.imul(x,0x01000193)>>>0}return x.toString(16)};
function unlocked(){try{return CODES.includes(localStorage.getItem("march_key"))}catch(e){return false}}
function gate(){lastScreen=gate;
 document.body.classList.remove("inplay");
 app.innerHTML=`${langBtn()}<div class="hero"><h1 class="big" style="font-size:clamp(2.2rem,11vw,3.2rem)"><span>SAFE</span><span style="color:var(--lM)">MARCHE</span><span style="color:var(--lR)">RYAN</span></h1><div class="stage env-fire">${figure(mk(SC[0]),"front")}</div></div>
 <div class="card" style="margin-top:16px"><h2>Accès réservé</h2><p class="muted" style="margin:4px 0 10px">Entre le code qui t'a été transmis pour accéder à l'entraînement.</p>
 <input id="code" type="text" autocomplete="off" autocapitalize="characters" inputmode="numeric" spellcheck="false" placeholder="Code d'accès" aria-label="Code d'accès"
  style="width:100%;font:inherit;font-size:1.2rem;letter-spacing:.08em;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--btn);color:var(--ink)">
 <p id="err" style="color:var(--blood);font-weight:600;min-height:1.4em;margin:8px 0 0"></p>
 <button class="primary" id="unlock">Déverrouiller</button></div>`;
 const inp=document.getElementById("code"),go=()=>{const h=hashCode(inp.value.trim().toUpperCase());
  if(CODES.includes(h)){try{localStorage.setItem("march_key",h)}catch(e){}intro()}
  else{document.getElementById("err").textContent="Code incorrect. Vérifie auprès de la personne qui te l'a envoyé.";flash("bad");buzz();inp.select()}};
 document.getElementById("unlock").onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go()};
}
unlocked()?intro():gate();
</script>
