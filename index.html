<meta name="theme-color" content="#1C2014">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D6CDB2; --panel:#E9E3D0; --ink:#23261C; --muted:#5C5F4E; --line:#A99F82;
  --olive:#4B5320; --blood:#9E1B14; --ok:#3E6B2C; --warn:#B8860B; --btn:#F4F0E2; --ground:#CFC6A8;
  --lM:#B3261E; --lA:#2F6DB3; --lR:#1F8A87; --lC:#7A4FA0; --lH:#B7810F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1F231A; --panel:#2E3326; --ink:#ECE6D2; --muted:#AFA98F; --line:#555B45;
  --olive:#9AA65A; --blood:#E0473C; --ok:#8BC06A; --warn:#E0B24A; --btn:#383E2E; --ground:#353B2B;
  --lM:#E0473C; --lA:#5B9BE0; --lR:#3FBFBA; --lC:#A980CF; --lH:#E0B24A;}}
:root[data-theme="dark"]{
  --bg:#1F231A; --panel:#2E3326; --ink:#ECE6D2; --muted:#AFA98F; --line:#555B45;
  --olive:#9AA65A; --blood:#E0473C; --ok:#8BC06A; --warn:#E0B24A; --btn:#383E2E; --ground:#353B2B;
  --lM:#E0473C; --lA:#5B9BE0; --lR:#3FBFBA; --lC:#A980CF; --lH:#E0B24A;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:10px 14px 28px}
.stencil,h1{font-family:"Saira Stencil One",Impact,"Arial Narrow",sans-serif;font-weight:400}
h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.35rem;margin:0;line-height:1.1}
p{margin:0 0 10px}
.muted{color:var(--muted)}
/* tracker */
.tracker{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 8px}
.tracker div{position:relative;font-family:"Saira Stencil One",Impact,sans-serif;font-size:1.9rem;line-height:1.35;text-align:center;
  border:2px solid var(--line);border-radius:8px;color:var(--line);transition:background .3s,color .3s,border-color .3s}
.tracker div.now{border-color:var(--c);color:var(--c)}
.tracker div.done{background:var(--c);border-color:var(--c);color:#fff;animation:pop .35s}
@keyframes pop{50%{transform:scale(1.15)}}
/* vitals */
.vitals{display:flex;align-items:center;gap:10px;font-family:"Barlow Condensed",sans-serif;font-weight:700}
.heart{width:26px;height:26px;color:var(--blood);animation:beat var(--dur,.75s) infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(.95)}}
.bar{flex:1;height:14px;background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--ok);transition:width .25s linear,background .3s}
.bpm{min-width:4.2em;text-align:right;font-size:1.05rem}
/* scene */
.scene{position:relative;display:grid;grid-template-columns:150px 1fr;gap:12px;margin:10px 0;padding:10px 12px 10px 6px;
  border-radius:10px;border:1px solid var(--line);
  background:radial-gradient(circle at 25% 60%,color-mix(in srgb,var(--ground) 70%,var(--panel)) 0 35%,var(--panel) 75%)}
.fig{width:150px;height:auto;display:block}
.phase{display:inline-block;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:.85rem;color:#fff;background:var(--blood);padding:1px 8px;border-radius:4px;margin-bottom:6px}
.ctx{font-size:.95rem;margin:6px 0 8px}
.inj{list-style:none;padding:0;margin:0;display:grid;gap:5px}
.inj li{font-size:.9rem;font-weight:500;line-height:1.25;display:flex;gap:6px;align-items:flex-start}
.badge{flex:none;display:grid;place-items:center;width:1.35em;height:1.35em;border-radius:50%;background:var(--ink);color:var(--panel);font-size:.75em;font-weight:700;margin-top:.1em}
.dot{flex:none;width:1.35em;text-align:center;color:var(--muted)}
.ring{transform-box:fill-box;transform-origin:center;animation:ping 1.1s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.85}to{transform:scale(2.6);opacity:0}}
.pop-in{transform-box:fill-box;transform-origin:center;animation:popin .35s ease-out}
@keyframes popin{from{transform:scale(.3);opacity:0}}
/* feedback */
.fb{display:flex;gap:8px;align-items:flex-start;min-height:3em;font-weight:500;font-size:.95rem;padding:8px 12px;border-radius:8px;margin-bottom:10px;border:1px dashed var(--line)}
.fb.good{background:color-mix(in srgb,var(--ok) 20%,transparent);border:1px solid var(--ok)}
.fb.bad{background:color-mix(in srgb,var(--blood) 18%,transparent);border:1px solid var(--blood)}
/* actions */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.act{display:flex;gap:9px;align-items:center;background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:62px;
  text-align:left;font-weight:600;font-size:.93rem;line-height:1.2;box-shadow:0 2px 0 var(--line)}
.act:active{transform:translateY(2px);box-shadow:none}
.act svg{flex:none;width:30px;height:30px;padding:4px;border-radius:7px;background:var(--panel);color:var(--olive);
  fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act:disabled{opacity:.35;text-decoration:line-through;cursor:default;box-shadow:none}
.act.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0}
#flash.bad{animation:flash .45s;box-shadow:inset 0 0 0 10px var(--blood),inset 0 0 60px color-mix(in srgb,var(--blood) 50%,transparent)}
#flash.good{animation:flash .45s;box-shadow:inset 0 0 0 6px var(--ok)}
@keyframes flash{from{opacity:1}to{opacity:0}}
.primary{display:block;width:100%;background:var(--olive);color:var(--panel);border:0;border-radius:10px;
  padding:15px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.25rem;margin-top:14px}
button:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
/* intro */
.hero{display:grid;grid-template-columns:1fr 130px;align-items:center;gap:8px;margin-top:10px}
.big{font-family:"Saira Stencil One",Impact,sans-serif;font-size:clamp(3.2rem,17vw,4.6rem);line-height:.9;margin:0}
.big span{display:block}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:14px 0;align-items:center}
.legend b{font-family:"Saira Stencil One",Impact,sans-serif;font-weight:400;font-size:1.5rem;color:var(--c);line-height:1}
.debrief{padding-left:0;list-style:none;margin:8px 0 0}
.debrief li{display:flex;gap:10px;margin:8px 0;align-items:flex-start}
.debrief .l{flex:none;font-family:"Saira Stencil One",Impact,sans-serif;color:#fff;background:var(--c);border-radius:5px;width:1.6em;text-align:center}
.score{font-family:"Saira Stencil One",Impact,sans-serif;font-size:3.2rem;line-height:1;margin:6px 0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.9rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0}
.endgrid{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center}
.note{font-size:.82rem;color:var(--muted);margin-top:16px}
.scene{grid-template-columns:178px 1fr!important;padding:8px 10px 8px 4px!important}
.fig.play{width:172px}
.viewbtn{display:block;width:100%;margin-top:6px;background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:7px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1rem}
.side h2{font-size:1.2rem}
.side .ctx{font-size:.88rem}
.side h3{font-family:"Barlow Condensed",sans-serif;font-size:.95rem;margin:8px 0 4px;color:var(--muted);font-weight:700}
.inj li.done span:last-child{text-decoration:line-through;opacity:.6}
.inj li.new{animation:pop .5s}
.fb.warn{background:color-mix(in srgb,var(--warn) 25%,transparent);border:1px solid var(--warn)}
.fb.info{background:var(--panel);border:1px solid var(--line)}
.coverbtn{display:block;width:100%;background:var(--blood);color:#fff;border:0;border-radius:10px;padding:13px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.2rem;margin-bottom:10px}
.kit{position:sticky;bottom:0;z-index:5;display:flex;gap:7px;overflow-x:auto;background:var(--bg);margin:0 -14px;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);scrollbar-width:none}
.kit::-webkit-scrollbar{display:none}
.tool{flex:none;width:80px;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:6px 3px;font-size:.7rem;font-weight:600;line-height:1.1;text-align:center;hyphens:auto}
.tool svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--olive)}
.tool.sel{background:var(--olive);border-color:var(--olive);color:var(--panel)}
.tool.sel svg{color:var(--panel)}
.hint{font-size:.85rem;color:var(--muted);margin:0 0 6px}
.figs2{display:flex;gap:6px;justify-content:center}
.figs2 .fig{width:120px}
.tag{font-size:.75rem;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:4px;white-space:nowrap}
.tag.found{background:var(--ok);color:#fff}.tag.miss{background:var(--blood);color:#fff}
.tracker2{display:flex;gap:10px;margin:6px 0 8px;justify-content:space-between}
.tracker2 .grp{display:flex;flex-direction:column;gap:2px;flex:var(--n)}
.tracker2 .gl{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:.72rem;color:var(--muted)}
.tracker2 .gl.on{color:var(--ink)}
.tracker2 .ls{display:flex;gap:3px}
.tracker2 .ls div{flex:1;font-family:"Saira Stencil One",Impact,sans-serif;font-size:1.15rem;line-height:1.5;text-align:center;border:2px solid var(--line);border-radius:6px;color:var(--line);transition:background .3s,color .3s}
.tracker2 .ls div.now{border-color:var(--c);color:var(--c)}
.tracker2 .ls div.done{background:var(--c);border-color:var(--c);color:#fff;animation:pop .35s}
.curstep{font-size:.9rem;margin:-2px 0 6px}
.curstep b{font-family:"Barlow Condensed",sans-serif;font-size:1rem}
.choice{background:var(--panel);border:2px solid var(--c,var(--olive));border-radius:10px;padding:10px 12px;margin-bottom:10px}
.choice h3{margin:0 0 8px;font-family:"Barlow Condensed",sans-serif;font-size:1.05rem}
.choice .opts{display:grid;gap:7px}
.choice button{background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:11px 12px;text-align:left;font-weight:600;box-shadow:0 2px 0 var(--line)}
.choice button:active{transform:translateY(2px);box-shadow:none}
.choice button:disabled{opacity:.4;text-decoration:line-through}
.cnt{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.cnt button{display:flex;flex-direction:column;align-items:center;padding:8px 4px!important;text-align:center!important}.cnt strong{font-family:"Saira Stencil One",Impact,sans-serif;font-weight:400;font-size:1.6rem;line-height:1.1}.cnt span{font-size:.75rem;color:var(--muted)}
.viewbtn.msel{background:var(--olive);color:var(--panel);border-color:var(--olive)}
.choice button.msel{border:2px solid var(--olive);background:color-mix(in srgb,var(--olive) 14%,var(--btn))}
.learn{background:color-mix(in srgb,#F2C94C 16%,var(--panel));border:1px solid #d4ab2c;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:.92rem}
.learn p{margin:0 0 6px}.learn.compact{padding:8px 10px}.learn .tip{font-weight:600}
.lrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lrow button{background:#F2C94C;color:#222;border:0;border-radius:8px;padding:8px 12px;font-weight:700}
.lrow label{display:flex;gap:6px;align-items:center;font-weight:600}
.hintz{animation:hintz 1s ease-in-out infinite}@keyframes hintz{50%{fill-opacity:.05;stroke-opacity:.4}}
.tool.hint,.choice button.hint,.viewbtn.hint{box-shadow:0 0 0 3px #F2C94C;animation:hintp 1s ease-in-out infinite}
@keyframes hintp{50%{box-shadow:0 0 0 6px rgba(242,201,76,.35)}}
.langbtn{float:right;margin-top:8px;background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-weight:700;color:var(--ink)}
.guide h2{font-size:1.1rem;margin:14px 0 4px}.guide h2:first-child{margin-top:0}.guide p{margin:0 0 6px}.guide ul{margin:0 0 6px;padding-left:20px}.guide li{margin:3px 0}
.grpt{font-family:"Saira Stencil One",Impact,sans-serif;font-size:1.1rem;margin:10px 0 2px}
.stage{position:relative;overflow:hidden;border-radius:9px;border:1px solid rgba(0,0,0,.25);box-shadow:inset 0 0 18px rgba(0,0,0,.25)}
.env-forest{background:radial-gradient(ellipse at 50% 100%,rgba(0,0,0,.25),transparent 55%),radial-gradient(circle at 15% 20%,#8f955f 0 3px,transparent 4px),radial-gradient(circle at 80% 35%,#7d8452 0 2px,transparent 3px),radial-gradient(circle at 30% 70%,#8a9058 0 2.5px,transparent 3.5px),radial-gradient(circle at 85% 80%,#747b4a 0 3px,transparent 4px),linear-gradient(180deg,#a7a57a,#8a8a5d);background-size:auto,40px 40px,34px 34px,46px 46px,38px 38px,auto}
.env-urban{background:radial-gradient(ellipse at 50% 100%,rgba(0,0,0,.25),transparent 55%),repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 1px,transparent 1px 30px),repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 1px,transparent 1px 44px),linear-gradient(180deg,#aca79c,#8e897f)}
.env-fire{background:radial-gradient(ellipse at 50% 100%,rgba(0,0,0,.3),transparent 55%),radial-gradient(circle at 25% 30%,#9b8d6c 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,#8d7f60 0 2.5px,transparent 3.5px),linear-gradient(180deg,#b3a37f,#8f8061);background-size:auto,36px 36px,44px 44px,auto}
.env-fire::after{content:"";position:absolute;inset:-30%;pointer-events:none;background:radial-gradient(circle at 20% 25%,rgba(70,70,70,.32),transparent 22%),radial-gradient(circle at 65% 15%,rgba(110,110,110,.28),transparent 20%),radial-gradient(circle at 45% 55%,rgba(80,80,80,.18),transparent 28%);animation:smoke 10s ease-in-out infinite alternate}
@keyframes smoke{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
.breath{transform-box:fill-box;transform-origin:50% 90%;animation:breathe var(--br,3.2s) ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.03,1.012)}}
.drip{animation:drip 1.3s ease-in infinite}.drip.d2{animation-delay:.65s}
@keyframes drip{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(16px);opacity:0}}
.bub{transform-box:fill-box;animation:bub 1.6s ease-out infinite}.bub.b2{animation-delay:.8s}
@keyframes bub{0%{transform:translate(0,0) scale(.5);opacity:0}30%{opacity:.9}100%{transform:translate(3px,-9px) scale(1.3);opacity:0}}
.zz{animation:zz 2.4s ease-in-out infinite}@keyframes zz{0%{transform:translate(0,4px);opacity:0}40%{opacity:1}100%{transform:translate(4px,-6px);opacity:0}}
.vein{animation:vein .8s ease-in-out infinite}@keyframes vein{50%{stroke-width:3.4}}
.tqIn .band{transform-box:fill-box;transform-origin:center;animation:band .35s ease-out}@keyframes band{from{transform:scaleX(1.4);opacity:0}}
.wind{transform-box:fill-box;transform-origin:center;animation:wind .8s cubic-bezier(.3,1.4,.5,1)}@keyframes wind{from{transform:rotate(-270deg)}}
.unfold{transform-box:fill-box;transform-origin:50% 0;animation:unfold .8s cubic-bezier(.2,.8,.2,1)}@keyframes unfold{from{transform:scaleY(.04);opacity:.3}}
.slideIn{transform-box:fill-box;transform-origin:center;animation:slideIn .5s ease-out}@keyframes slideIn{from{transform:scaleX(.1);opacity:0}}
.shimmer{animation:shim 2.6s ease-in-out infinite}@keyframes shim{50%{opacity:.15}}
.tap{transform-box:fill-box;transform-origin:center;animation:tap .55s ease-out forwards;fill:none;stroke:#fff;stroke-width:1.6}@keyframes tap{from{transform:scale(.4);opacity:1}to{transform:scale(2.6);opacity:0}}
.snd{background:none;border:1px solid var(--line);border-radius:6px;padding:0 8px;font-size:.95rem;line-height:1.6}
.fig.play{width:176px}

/* ---- écran de jeu plein écran ---- */
.play .curstep{font-size:.78rem;margin:0;line-height:1.2}
body.inplay{height:100%;overflow:hidden}
body.inplay main{height:100%;display:flex;flex-direction:column;padding:6px 10px 0;gap:5px}
.topbar{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);flex:none}
.topbar .sp{flex:1}
.topbar button{white-space:nowrap;background:var(--btn);border:1px solid var(--line);border-radius:7px;padding:3px 9px;font-size:.85rem;font-weight:700;color:var(--ink)}
.topbar button.on{background:#F2C94C;border-color:#d4ab2c;color:#222}
.play .tracker2{margin:0;gap:6px;flex:none}
.play .tracker2 .gl{font-size:.62rem;line-height:1}
.play .tracker2 .ls div{font-size:.95rem;line-height:1.45;border-width:1.5px;border-radius:5px}
.play .vitals{flex:none;font-size:.85rem;gap:8px}
.play .heart{width:18px;height:18px}.play .bar{height:9px}
.mid{flex:1;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:100%;gap:8px}
.mid .stage{height:100%;aspect-ratio:120/262;max-width:62vw}

es :":"Class code to give to students:","Clé formateur (pour retrouver la classe sur un autre téléphone) :":"Instructor key (to recover the class on another phone):","📤 Partager le code":"📤 Share the code","↻ Actualiser":"↻ Refresh","Chargement…":"Loading…","Rejoins ma classe SAFE MARCHE RYAN : entre le code":"Join my SAFE MARCHE RYAN class: enter the code","dans le champ « Code de classe » de l'appli.":"in the \"Class code\" field of the app.","✓ Message copié.":"✓ Message copied.","élèves":"students","mis à jour à":"updated at","Aucun élève pour l'instant. Partage le code de classe.":"No students yet. Share the class code.","Accès refusé à cette classe.":"Access to this class denied.","Pris en charge":"Managed",": ici,":": here,","»":"\"","«":"\"","📤 Envoyer à mon formateur":"📤 Send to my instructor","sur le mannequin. Fais un vrai balayage et retourne le blessé : certaines blessures sont cachées, et la réévaluation peut en faire apparaître de nouvelles.": "on the mannequin. Do a real sweep and roll the casualty over: some wounds are hidden, and reassessment can reveal new ones.", "Viscères couverts par un pansement humide non adhérent, sans comprimer ni réintégrer. Jambes fléchies, rien à boire, surveillance du choc.": "Bowel covered with a moist non-adherent dressing, without compressing or pushing it back. Knees bent, nothing by mouth, monitor for shock.", "Doctrine française SAFE MARCHE RYAN. SC1 pour tout combattant, SC2 pour l'auxiliaire sanitaire, SC3 pour le personnel médical.": "French SAFE MARCHE RYAN doctrine. SC1 for every soldier, SC2 for the combat medic assistant, SC3 for medical personnel.", "Outil d'entraînement au raisonnement. Ne remplace pas une formation SC1 / SC2 / TCCC encadrée, ni les protocoles de ton unité.": "A decision-making training tool. It does not replace supervised SC1 / SC2 / TCCC training or your unit's protocols.", "Ce jeu s'appuie sur ces doctrines. En cas de différence, ce sont les protocoles de ta formation et de ton unité qui priment.": "This game is based on these doctrines. If anything differs, your course and unit protocols take precedence.", "Adaptation civile du TCCC (forces de l'ordre, secours, tueries de masse) : Direct Threat, Indirect Threat, Evacuation Care.": "Civilian adaptation of TCCC (law enforcement, EMS, mass casualty attacks): Direct Threat, Indirect Threat, Evacuation Care.", "Référence militaire internationale : Care Under Fire, Tactical Field Care, Tactical Evacuation Care, algorithme MARCH PAWS.": "International military reference: Care Under Fire, Tactical Field Care, Tactical Evacuation Care, MARCH PAWS algorithm.", "Garrot sur l'avant-bras gauche. L'éviscération impressionne, mais elle ne tue pas aussi vite que cette hémorragie.": "Tourniquet on the left forearm. The evisceration looks dramatic, but it doesn't kill as fast as this bleed.", "Sous la plaie, il n'arrête pas un saignement qui vient du cœur : le sang continue de couler. Il se pose au-dessus.": "Below the wound it can't stop blood coming from the heart: the bleeding continues. It goes above.", "Avant de toucher le blessé : faire cesser le danger, évaluer la situation, soustraire au danger, premier bilan.": "Before touching the casualty: stop the threat, assess the scene, move to safety, first evaluation.", "Une compresse sèche colle aux intestins et les lèse au retrait : le pansement doit être humide et non adhérent.": "A dry gauze sticks to the bowel and damages it on removal: the dressing must be moist and non-adherent.", ", les os empêchent de comprimer l'artère : le garrot est inefficace. Décale-le au-dessus de l'articulation.": ", the bones prevent compressing the artery: the tourniquet won't work. Move it above the joint.", "Pneumothorax sous tension : « Exsufflation » sur le thorax atteint (d'abord décoller un bord du pansement).": "Tension pneumothorax: \"Decompression\" on the injured chest (first burp the seal by lifting one edge).", "Pas de chrono, pas de pénalité sur l'état du blessé. Explications à chaque étape et indices à la demande.": "No timer, no penalty on the casualty's condition. Explanations at every step and hints on demand.", "Sur la plaie, le garrot ne comprime pas l'artère en amont : le saignement continue. Remonte-le au-dessus.": "Over the wound, the tourniquet doesn't compress the artery upstream: the bleeding continues. Move it higher.", "Chercher et stopper toute hémorragie massive : balayage des 4 membres, aisselles, aines, sous le gilet.": "Find and stop any massive bleeding: sweep all 4 limbs, armpits, groin, under the vest.", "Jamais réintégrer les viscères : risque d'infection grave et de lésions. On les couvre là où ils sont.": "Never push the bowel back in: risk of severe infection and injury. Cover it where it is.", "Posé haut et serré : le bon réflexe sous le feu ou si la plaie est mal localisée. À réévaluer ensuite.": "Applied high and tight: the right reflex under fire or when the wound is hard to locate. Reassess later.", "Suspicion de pneumothorax sous tension : décoller un bord du pansement (burp), exsufflation si formé.": "Suspected tension pneumothorax: burp the seal by lifting one edge, needle decompression if trained.", "Balayage : outil « Examiner » sur chaque membre en surbrillance. Des blessures peuvent être cachées.": "Sweep: \"Examine\" tool on each highlighted limb. Wounds may be hidden.", "Posé 5 à 8 cm au-dessus de la plaie, hors articulation : la position de référence une fois à l'abri.": "Applied 2–3 inches (5–8 cm) above the wound, not over a joint: the standard position once under cover.", "Après une explosion, un blessé est au sol, inconscient. Il reste peut-être des engins non explosés.": "After an explosion, a casualty is lying on the ground, unconscious. There may be unexploded devices nearby.", "Plaie trop proche du tronc (zone jonctionnelle) : garrot impossible, fais un méchage + compression.": "Wound too close to the torso (junctional area): no tourniquet possible, pack the wound and apply pressure.", "Couvre avec un pansement humide non adhérent, sans comprimer, et ne réintègre jamais les viscères.": "Cover with a moist non-adherent dressing, without compressing, and never push the bowel back in.", "Urgence relative : blessé stable, on ne sature pas les moyens d'évacuation. En attendant : RYAN.": "Routine priority: stable casualty, don't overload evacuation assets. While waiting: RYAN.", "Colle ici le message reçu de l'élève (bouton « Envoyer à mon formateur » dans sa progression).": "Paste the message received from the student here (\"Send to my instructor\" button in their progress).", "Faire cesser ce qui fait des victimes : riposter, neutraliser la menace ou écarter le danger.": "Stop whatever is causing casualties: return fire, neutralise the threat or remove the danger.", "Pas de compression sur des viscères : ça les abîme et aggrave l'état. On couvre sans serrer.": "No pressure on exposed bowel: it damages it and makes things worse. Cover without tightening.", "Analgésie selon ton protocole et tes compétences : la douleur aggrave le stress et le choc.": "Pain management according to your protocol and skills: pain worsens stress and shock.", "Retourne le blessé (bouton ↻), puis « Examiner » sur le dos : cherche un orifice de sortie.": "Roll the casualty over (↻ button), then \"Examine\" the back: look for an exit wound.", "Soins complémentaires : pansements, éviscération, attelles, fiche de l'avant, surveillance.": "Additional care: dressings, evisceration, splints, casualty card, monitoring.", "Fiche de l'avant remplie (heures, gestes, constantes). Surveillance jusqu'à l'évacuation.": "Casualty card filled in (times, interventions, vitals). Monitoring until evacuation.", "Le protocole complet du sauvetage au combat, du premier coup de feu jusqu'à l'évacuation.": "The complete French combat casualty care protocol, from the first shot to evacuation.", "Une grenade a explosé à distance. Un équipier se plaint du bras gauche et de l'œil droit.": "A grenade exploded some distance away. A teammate complains about his left arm and right eye.", "Réexaminer chaque soin posé : un garrot peut lâcher, un pansement peut ne plus suffire.": "Re-check every intervention: a tourniquet can loosen, a dressing may no longer be enough.", "Ton binôme est touché pendant un échange de tirs. Il crie et se tient la cuisse droite.": "Your buddy is hit during a firefight. He's shouting and holding his right thigh.", "Vérifier que l'air passe. S'il parle, c'est bon. Inconscient qui ronfle : canule + PLS.": "Make sure air gets through. If he talks, it's fine. Unconscious and snoring: NPA + recovery position.", "Outil « Examiner » sur la tête : est-ce qu'il parle, est-ce qu'il respire bruyamment ?": "\"Examine\" tool on the head: is he talking, is his breathing noisy?", "Un équipier a chuté d'environ 6 mètres depuis un toit. Il se plaint surtout du bassin.": "A teammate fell about 6 metres (20 ft) from a roof. He mainly complains about his pelvis.", "Cours certifiants TCCC (militaires) et TECC (civils) dispensés dans de nombreux pays.": "Certified TCCC (military) and TECC (civilian) courses taught in many countries.", "Heure de pose notée : l'équipe médicale doit savoir depuis quand le garrot est serré.": "Time of application written down: the medical team needs to know how long the tourniquet has been on.", "Deuxième garrot sur la jambe gauche. Invisible de face : seul le balayage la révèle.": "Second tourniquet on the left leg. Invisible from the front: only the sweep reveals it.", "Décoller un bord du pansement (burp), puis exsufflation à l'aiguille si tu es formé.": "Burp the seal by lifting one edge, then needle decompression if you are trained.", "Un équipier a été touché au ventre par un éclat. Il se tient l'abdomen à deux mains.": "A teammate was hit in the belly by a fragment. He's holding his abdomen with both hands.", "Examiner tout le thorax, devant ET derrière. Plaie soufflante : pansement occlusif.": "Examine the whole chest, front AND back. Sucking chest wound: chest seal.", "Supériorité du feu d'abord : la meilleure médecine, c'est de neutraliser la menace.": "Fire superiority first: the best medicine is neutralising the threat.", "Programme grand public de contrôle des hémorragies : compression, méchage, garrot.": "Public bleeding-control program: pressure, wound packing, tourniquet.", "Second garrot juste au-dessus du premier. C'est exactement pour ça qu'on réévalue.": "Second tourniquet just above the first. This is exactly why we reassess.", "Un blessé a reçu un pansement occlusif sur le thorax il y a 10 min. Il se dégrade.": "A casualty received a chest seal 10 minutes ago. He's deteriorating.", "Couverture de survie et isolation du sol : l'hypothermie aggrave les saignements.": "Survival blanket and insulation from the ground: hypothermia worsens bleeding.", "Deuxième pansement occlusif sur la sortie : cherche toujours l'orifice de sortie.": "Second chest seal on the exit wound: always look for an exit wound.", "Méchage + compression de l'aisselle : zone jonctionnelle, pas de garrot possible.": "Armpit packed and pressure applied: junctional area, no tourniquet possible.", "Sur un membre, le garrot est plus rapide et plus sûr pour une hémorragie massive.": "On a limb, a tourniquet is faster and safer for massive bleeding.", "Hémorragie massive, voies aériennes, respiration, choc, hypothermie, évacuation.": "Massive bleeding, airway, respiration, circulation/shock, hypothermia, evacuation.", "Jamais de méchage dans une éviscération : on couvre humide, sans rien enfoncer.": "Never pack an evisceration: cover it moist, without pushing anything in.", "À l'abri : garrot 5 à 8 cm au-dessus de la plaie, jamais sur une articulation.": "Under cover: tourniquet 2–3 inches (5–8 cm) above the wound, never over a joint.", "Attelle une fois le saignement contrôlé : moins de douleur, moins de lésions.": "Splint once the bleeding is controlled: less pain, less damage.", "Pas de pansement compressif sur des viscères : on couvre humide, sans serrer.": "No pressure dressing on exposed bowel: cover it moist, without tightening.", "Éviscération : couvrir humide sans comprimer ni réintégrer, jambes fléchies.": "Evisceration: cover moist without compressing or pushing back, knees bent.", "Pansement compressif simple : pas d'hémorragie massive, donc pas de garrot.": "Simple pressure dressing: no massive bleeding, so no tourniquet.", "Soulager la douleur selon ton protocole, sauf si le blessé est inconscient.": "Relieve pain according to your protocol, unless the casualty is unconscious.", "Balayage des 4 membres (et sous le gilet), contrôle de chaque hémorragie.": "Sweep all 4 limbs (and under the vest), control every bleed.", "Soustraire le blessé au danger : l'extraire à l'abri avant de le soigner.": "Get the casualty out of danger: move him to cover before treating him.", "TCCC : plaie abdominale, éviscération (couvrir humide, ne pas réintégrer)": "TCCC: abdominal wound, evisceration (cover moist, do not push back in)", "Évaluer la scène : autres menaces, engins non explosés, feu, circulation.": "Assess the scene: other threats, unexploded devices, fire, traffic.", "Coque rigide sur l'œil, sans appuyer, sans rincer, sans retirer l'éclat.": "Rigid shield over the eye, no pressure, no rinsing, don't remove the fragment.", "Demande d'évacuation en urgence absolue transmise. En attendant : RYAN.": "Urgent evacuation request sent. While waiting: RYAN.", "Le blessé ne se dégrade pas avec le temps. Seules les erreurs coûtent.": "The casualty doesn't deteriorate over time. Only mistakes cost you.", "Sources : SSA (sauvetage au combat), CoTCCC (TCCC Guidelines), C-TECC.": "Sources: French Military Health Service (combat casualty care), CoTCCC (TCCC Guidelines), C-TECC.", "En attendant l'évacuation : réévaluation, yeux, analgésie, nursing.": "While waiting for evacuation: reassessment, eyes, analgesia, nursing care.", "Coque rigide sur l'œil, sans appuyer ni retirer le corps étranger.": "Rigid shield over the eye, no pressure, don't remove the foreign body.", "Outil « Feutre » sur un membre garrotté : on note l'heure de pose.": "\"Marker\" tool on a limb with a tourniquet: write down the time.", "Saignement modéré : un pansement compressif suffit, pas de garrot.": "Moderate bleeding: a pressure dressing is enough, no tourniquet.", "Situation évaluée : menaces résiduelles, engins, feu, circulation.": "Scene assessed: remaining threats, devices, fire, traffic.", "TCCC : hémorragie jonctionnelle, méchage et pansement hémostatique": "TCCC: junctional hemorrhage, wound packing and hemostatic dressing", "Chute + douleur du bassin : « Ceinture pelvienne » sur le bassin.": "Fall + pelvic pain: \"Pelvic binder\" on the pelvis.", "Entre le code qui t'a été transmis pour accéder à l'entraînement.": "Enter the code you were given to access the training.", "Isoler du sol et couvrir : l'hypothermie aggrave les saignements.": "Insulate from the ground and cover: hypothermia worsens bleeding.", "Outil « Examiner » sur chaque zone déjà soignée, en surbrillance.": "\"Examine\" tool on each area already treated (highlighted).", "Code incorrect. Vérifie auprès de la personne qui te l'a envoyé.": "Wrong code. Check with the person who sent it to you.", "Examiner les yeux : une lésion oculaire passe souvent inaperçue.": "Examine the eyes: eye injuries are often missed.", "Il est conscient et souffre : l'analgésie fait partie des soins.": "He's conscious and in pain: pain management is part of care.", "Inconscient : pas d'analgésie, surveillance des voies aériennes.": "Unconscious: no analgesia, monitor the airway.", "Pouls radial, signes de choc, heure de pose des garrots, bassin.": "Radial pulse, signs of shock, tourniquet times, pelvis.", "Fracture ouverte de la jambe droite qui saigne sous le pantalon": "Open fracture of the right leg bleeding under the trousers", "Mauvais endroit : l'exsufflation se fait sur le thorax atteint.": "Wrong place: decompression is done on the injured side of the chest.", "Pas de boisson : risque de vomissement et de chirurgie à venir.": "Nothing to drink: risk of vomiting and upcoming surgery.", "Inconscient qui ronfle : « Canule NPA » sur la tête, puis PLS.": "Unconscious and snoring: \"NPA\" on the head, then recovery position.", "Méchage + compression : zone jonctionnelle, garrot impossible.": "Wound packing + pressure: junctional area, no tourniquet possible.", "Zone dangereuse : garrot haut et serré, à la racine du membre.": "Dangerous area: tourniquet high and tight, at the top of the limb.", "National Association of Emergency Medical Technicians (NAEMT)": "National Association of Emergency Medical Technicians (NAEMT)", "Plaie de l'abdomen avec intestins extériorisés (éviscération)": "Abdominal wound with bowel exposed (evisceration)", "Sans sécuriser d'abord, tu risques d'être le deuxième blessé.": "Without securing the area first, you risk becoming the second casualty.", "Hémorragie, détresse respiratoire ou choc : urgence absolue.": "Bleeding, respiratory distress or shock: urgent priority.", "Outil « Examiner » sur un bras pour prendre le pouls radial.": "\"Examine\" tool on an arm to take the radial pulse.", "Pour des viscères, utilise un pansement humide non adhérent.": "For exposed bowel, use a moist non-adherent dressing.", "Saignement massif sous l'aisselle droite, caché par le gilet": "Massive bleeding under the right armpit, hidden by the vest", "TCCC : plaie thoracique ouverte, pansement occlusif à valve": "TCCC: open chest wound, vented chest seal", "Rythme réel : un blessé qui saigne tient environ 1 minute.": "Real pace: a bleeding casualty lasts about 1 minute.", "Réévaluation + PAWS : Pain, Antibiotics, Wounds, Splinting": "Reassessment + PAWS: Pain, Antibiotics, Wounds, Splinting", "Hémorragie, détresse ou choc : c'est une urgence absolue.": "Bleeding, distress or shock: this is an urgent priority.", "Zone jonctionnelle : pas de garrot. Outil « Méchage » sur": "Junctional area: no tourniquet. \"Wound packing\" tool on", "« Coque oculaire » sur la tête : on protège sans appuyer.": "\"Eye shield\" on the head: protect without pressing.", "Garrot : la douleur du bassin masquait cette hémorragie.": "Tourniquet: the pelvic pain was masking this bleed.", "Il est conscient et souffre : analgésie selon protocole.": "He's conscious and in pain: analgesia per protocol.", "Premier bilan rapide : conscient ? hémorragie évidente ?": "Quick first check: conscious? obvious bleeding?", "Très agité, parle difficilement. Veines du cou gonflées.": "Very agitated, struggling to speak. Distended neck veins.", "Un blessé par balle se plaint d'avoir du mal à respirer.": "A gunshot casualty complains of difficulty breathing.", "Canule nasopharyngée + PLS : voies aériennes protégées.": "Nasopharyngeal airway + recovery position: airway protected.", "Committee for Tactical Emergency Casualty Care (C-TECC)": "Committee for Tactical Emergency Casualty Care (C-TECC)", "Détresse respiratoire qui s'aggrave malgré le pansement": "Worsening respiratory distress despite the chest seal", "Le saignement de la cuisse reprend (garrot insuffisant)": "The thigh is bleeding again (tourniquet not tight enough)", "Service de santé des armées (SSA), ministère des Armées": "French Military Health Service (SSA), Ministry of the Armed Forces", "Détresse respiratoire croissante malgré les pansements": "Increasing respiratory distress despite the chest seals", "Outil « Examiner » sur la tête pour vérifier les yeux.": "\"Examine\" tool on the head to check the eyes.", "Saignement abondant à l'arrière de l'avant-bras gauche": "Heavy bleeding at the back of the left forearm", "Contrôle d'abord l'hémorragie, l'attelle vient après.": "Control the bleeding first, the splint comes after.", "Hémorragie d'un membre : « Garrot » haut et serré sur": "Limb bleeding: \"Tourniquet\" high and tight on", "une hémorragie massive constatée n'est pas contrôlée.": "an identified massive bleed is not controlled.", "Ceinture pelvienne au niveau des grands trochanters.": "Pelvic binder at the level of the greater trochanters.", "Choisis un outil, puis touche une zone du mannequin.": "Pick a tool, then tap an area of the mannequin.", "Pas de détresse vitale : c'est une urgence relative.": "No life-threatening distress: this is a routine priority.", "Soustraire le blessé au danger (extraction à l'abri)": "Move the casualty out of danger (extract to cover)", "Tu n'as rien constaté ici : examine d'abord la zone.": "You haven't found anything here: examine the area first.", "Remplis la fiche de l'avant et surveille le blessé.": "Fill in the casualty card and monitor the casualty.", "soins complémentaires à faire (pansement, attelle).": "additional care to do (dressing, splint).", "La ceinture pelvienne se pose au niveau du bassin.": "The pelvic binder goes on the pelvis.", "SAFE d'abord : choisis la bonne action ci-dessous.": "SAFE first: choose the right action below.", "Stop the burning process (faire cesser le danger)": "Stop the burning process (stop the threat)", "Couvrir avec un pansement humide, sans comprimer": "Cover with a moist dressing, without pressure", "Faire cesser le danger (riposte, neutralisation)": "Stop the threat (return fire, neutralise)", "Plaies de l'avant-bras gauche, saignement modéré": "Wounds on the left forearm, moderate bleeding", "Quatre fois plus de temps, idéal pour apprendre.": "Four times more time, ideal for learning.", "Saignement abondant à l'arrière du mollet gauche": "Heavy bleeding at the back of the left calf", "Aucun code de progression trouvé dans ce texte.": "No progress code found in this text.", "Garrot posé sur la cuisse : hémorragie stoppée.": "Tourniquet on the thigh: bleeding stopped.", "Inconscient, respiration bruyante et ronflante.": "Unconscious, noisy snoring respirations.", "Premier bilan : conscience, hémorragie évidente": "First evaluation: consciousness, obvious bleeding", "TCCC : pneumothorax s let AC=null,SOUND=false;try{SOUND=localStorage.getItem("march_snd")==="1"}catch(e){}
function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C()}return AC}
function tone(f,d,type="sine",vol=.15,when=0){if(!SOUND)return;const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+when;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.03)}
function noise(d,vol=.2,freq=2500){if(!SOUND)return;const c=ac();if(!c)return;const b=c.createBuffer(1,Math.floor(c.sampleRate*d),c.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length)*(Math.random()<.3?1:.4);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type="bandpass";f.frequency.value=freq;const g=c.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(c.destination);s.start()}
const SFX={ok:()=>{tone(660,.12,"sine",.12);tone(990,.2,"sine",.1,.09)},bad:()=>{tone(150,.28,"square",.06);tone(110,.3,"square",.05,.05)},
 warn:()=>{tone(880,.1,"triangle",.12);tone(880,.1,"triangle",.12,.16)},velcro:()=>noise(.4,.35,3200),beat:()=>{tone(58,.13,"sine",.4);tone(52,.11,"sine",.3,.15)}};

<p>Ton code personnel (E-XXXX-XXXX) t'a été transmis par ton formateur. Il est lié à ton téléphone : il ne fonctionne que sur le premier appareil où tu l'actives. Si tu changes de téléphone, demande à ton formateur de le faire réinitialiser.</p>
<h2>Rejoindre ta classe</h2>
<p>À l'accueil, entre le code de classe donné par ton formateur (ex. ABCD-1234) dans le champ « Code de classe », une seule fois. Ensuite, chaque série terminée lui est envoyée automatiquement. Sans réseau, l'envoi se fait à la prochaine ouverture de l'appli.</p>
<h2>Préparer une série</h2>
<ul><li><strong>Temps disponible</strong> : Apprentissage (sans chrono ni pénalité, avec explications), Découverte, Normal, Intense, ou Temps illimité.</li>
<li><strong>Nombre de blessés</strong> : 1, 3, 5 ou 8.</li>
<li><strong>Type de blessés</strong> : scénarios fixes, aléatoires ou mélange. Aucune série n'est identique à la précédente.</li></ul>
<h2>Jouer</h2>
<ul><li>Commence toujours par <strong>SAFE</strong> : choisis les actions dans le bon ordre avant de toucher le blessé.</li>
<li>Ensuite, <strong>choisis un outil dans la trousse</strong> en bas de l'écran, puis <strong>touche la zone</strong> du mannequin.</li>

<h2>L'aide</h2>

<h2>Ta progression</h2>

teacher:`<h2>Ton accès</h2>
<p>Ton code formateur personnel (F-XXXX-XXXX) est lié à ton téléphone : il ne fonctionne que sur le premier appareil où tu l'actives. En cas de changement de téléphone, demande sa réinitialisation à l'administrateur. Une fois connecté, tu as le bouton « Formateur » sur l'accueil.</p>

en:{
student:`<h2>Your access</h2>
<p>Your personal code (E-XXXX-XXXX) was given to you by your instructor. It is tied to your phone: it only works on the first device where you activate it. If you change phones, ask your instructor to have it reset.</p>
<h2>Join your class</h2>
<p>On the home screen, enter the class code from your instructor (e.g. ABCD-1234) in the "Class code" field, once. After that, every completed series is sent to them automatically. Without a connection, it is sent the next time you open the app.</p>
<h2>Set up a series</h2>
<ul><li><strong>Time available</strong>: Learning (no timer or penalty, with explanations), Discovery, Normal, Intense, or Unlimited time.</li>
<li><strong>Number of casualties</strong>: 1, 3, 5 or 8.</li>
<li><strong>Casualty type</strong>: fixed scenarios, random or mixed. No two series are the same.</li></ul>
<h2>Playing</h2>
<ul><li>Always start with <strong>SAFE</strong>: choose the actions in the right order before touching the casualty.</li>
<li>Then <strong>pick a tool from the kit</strong> at the bottom of the screen and <strong>tap the area</strong> on the mannequin.</li>
<li><strong>Examine</strong> is for palpation: do a full sweep of all 4 limbs and use the <strong>↻ Back</strong> button to roll the casualty over. Some wounds are hidden.</li>
<li>Follow the <strong>MARCHE</strong> order (bleeding, airway, respiration, shock, hypothermia, evacuation), then <strong>RYAN</strong> while waiting for evacuation (reassessment, eyes, analgesia, additional care).</li>
<li>The top bar shows the current step. The gauge and heart show the casualty's condition.</li></ul>
<h2>Help</h2>
<p>The 💡 button shows the next action. Outside Learning mode, each hint costs points. All help, including auto help, is counted and visible to your instructor.</p>
<h2>Your progress</h2>
<p>"Progress" shows your series history and your weak point: the protocol step where you make the most mistakes. Only completed series count.</p>
<h2>Good to know</h2>
<p>This app trains your decision-making. It does not replace supervised SC1/SC2/TCCC training or your unit's protocols. Your first name and results are stored online so your instructor can follow your progress.</p>`,
teacher:`<h2>Your access</h2>
