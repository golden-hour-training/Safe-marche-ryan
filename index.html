<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MARCH Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D6CDB2; --panel:#E9E3D0; --ink:#23261C; --muted:#5C5F4E; --line:#A99F82;
  --olive:#4B5320; --blood:#9E1B14; --ok:#3E6B2C; --warn:#B8860B; --btn:#F4F0E2; --ground:#CFC6A8;
  --lM:#B3261E; --lA:#2F6DB3; --lR:#1F8A87; --lC:#7A4FA0; --lH:#B7810F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1F231A; --panel:#2E3326; --ink:#ECE6D2; --muted:#AFA98F; --line:#555B45;
  --olive:#9AA65A; --blood:#E0473C; --ok:#8BC06A; --warn:#E0B24A; --btn:#383E2E; --ground:#353B2B;
  --lM:#E0473C; --lA:#5B9BE0; --lR:#3FBFBA; --lC:#A980CF; --lH:#E0B24A;}}
:root[data-theme="dark"]{
  --bg:#1F231A; --panel:#2E3326; --ink:#ECE6D2; --muted:#AFA98F; --line:#555B45;
  --olive:#9AA65A; --blood:#E0473C; --ok:#8BC06A; --warn:#E0B24A; --btn:#383E2E; --ground:#353B2B;
  --lM:#E0473C; --lA:#5B9BE0; --lR:#3FBFBA; --lC:#A980CF; --lH:#E0B24A;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:10px 14px 28px}
.stencil,h1{font-family:"Saira Stencil One",Impact,"Arial Narrow",sans-serif;font-weight:400}
h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.35rem;margin:0;line-height:1.1}
p{margin:0 0 10px}
.muted{color:var(--muted)}
/* tracker */
.tracker{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 8px}
.tracker div{position:relative;font-family:"Saira Stencil One",Impact,sans-serif;font-size:1.9rem;line-height:1.35;text-align:center;
  border:2px solid var(--line);border-radius:8px;color:var(--line);transition:background .3s,color .3s,border-color .3s}
.tracker div.now{border-color:var(--c);color:var(--c)}
.tracker div.done{background:var(--c);border-color:var(--c);color:#fff;animation:pop .35s}
@keyframes pop{50%{transform:scale(1.15)}}
/* vitals */
.vitals{display:flex;align-items:center;gap:10px;font-family:"Barlow Condensed",sans-serif;font-weight:700}
.heart{width:26px;height:26px;color:var(--blood);animation:beat var(--dur,.75s) infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(.95)}}
.bar{flex:1;height:14px;background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--ok);transition:width .25s linear,background .3s}
.bpm{min-width:4.2em;text-align:right;font-size:1.05rem}
/* scene */
.scene{position:relative;display:grid;grid-template-columns:150px 1fr;gap:12px;margin:10px 0;padding:10px 12px 10px 6px;
  border-radius:10px;border:1px solid var(--line);
  background:radial-gradient(circle at 25% 60%,color-mix(in srgb,var(--ground) 70%,var(--panel)) 0 35%,var(--panel) 75%)}
.fig{width:150px;height:auto;display:block}
.phase{display:inline-block;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:.85rem;color:#fff;background:var(--blood);padding:1px 8px;border-radius:4px;margin-bottom:6px}
.ctx{font-size:.95rem;margin:6px 0 8px}
.inj{list-style:none;padding:0;margin:0;display:grid;gap:5px}
.inj li{font-size:.9rem;font-weight:500;line-height:1.25;display:flex;gap:6px;align-items:flex-start}
.badge{flex:none;display:grid;place-items:center;width:1.35em;height:1.35em;border-radius:50%;background:var(--ink);color:var(--panel);font-size:.75em;font-weight:700;margin-top:.1em}
.dot{flex:none;width:1.35em;text-align:center;color:var(--muted)}
.ring{transform-box:fill-box;transform-origin:center;animation:ping 1.1s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.85}to{transform:scale(2.6);opacity:0}}
.pop-in{transform-box:fill-box;transform-origin:center;animation:popin .35s ease-out}
@keyframes popin{from{transform:scale(.3);opacity:0}}
/* feedback */
.fb{display:flex;gap:8px;align-items:flex-start;min-height:3em;font-weight:500;font-size:.95rem;padding:8px 12px;border-radius:8px;margin-bottom:10px;border:1px dashed var(--line)}
.fb.good{background:color-mix(in srgb,var(--ok) 20%,transparent);border:1px solid var(--ok)}
.fb.bad{background:color-mix(in srgb,var(--blood) 18%,transparent);border:1px solid var(--blood)}
/* actions */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.act{display:flex;gap:9px;align-items:center;background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:62px;
  text-align:left;font-weight:600;font-size:.93rem;line-height:1.2;box-shadow:0 2px 0 var(--line)}
.act:active{transform:translateY(2px);box-shadow:none}
.act svg{flex:none;width:30px;height:30px;padding:4px;border-radius:7px;background:var(--panel);color:var(--olive);
  fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act:disabled{opacity:.35;text-decoration:line-through;cursor:default;box-shadow:none}
.act.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0}
#flash.bad{animation:flash .45s;box-shadow:inset 0 0 0 10px var(--blood),inset 0 0 60px color-mix(in srgb,var(--blood) 50%,transparent)}
#flash.good{animation:flash .45s;box-shadow:inset 0 0 0 6px var(--ok)}
@keyframes flash{from{opacity:1}to{opacity:0}}
.primary{display:block;width:100%;background:var(--olive);color:var(--panel);border:0;border-radius:10px;
  padding:15px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.25rem;margin-top:14px}
button:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
/* intro */
.hero{display:grid;grid-template-columns:1fr 130px;align-items:center;gap:8px;margin-top:10px}
.big{font-family:"Saira Stencil One",Impact,sans-serif;font-size:clamp(3.2rem,17vw,4.6rem);line-height:.9;margin:0}
.big span{display:block}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:14px 0;align-items:center}
.legend b{font-family:"Saira Stencil One",Impact,sans-serif;font-weight:400;font-size:1.5rem;color:var(--c);line-height:1}
.debrief{padding-left:0;list-style:none;margin:8px 0 0}
.debrief li{display:flex;gap:10px;margin:8px 0;align-items:flex-start}
.debrief .l{flex:none;font-family:"Saira Stencil One",Impact,sans-serif;color:#fff;background:var(--c);border-radius:5px;width:1.6em;text-align:center}
.score{font-family:"Saira Stencil One",Impact,sans-serif;font-size:3.2rem;line-height:1;margin:6px 0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.9rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0}
.endgrid{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center}
.note{font-size:.82rem;color:var(--muted);margin-top:16px}
.scene{grid-template-columns:178px 1fr!important;padding:8px 10px 8px 4px!important}
.fig.play{width:172px}
.viewbtn{display:block;width:100%;margin-top:6px;background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:7px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1rem}
.side h2{font-size:1.2rem}
.side .ctx{font-size:.88rem}
.side h3{font-family:"Barlow Condensed",sans-serif;font-size:.95rem;margin:8px 0 4px;color:var(--muted);font-weight:700}
.inj li.done span:last-child{text-decoration:line-through;opacity:.6}
.inj li.new{animation:pop .5s}
.fb.warn{background:color-mix(in srgb,var(--warn) 25%,transparent);border:1px solid var(--warn)}
.fb.info{background:var(--panel);border:1px solid var(--line)}
.coverbtn{display:block;width:100%;background:var(--blood);color:#fff;border:0;border-radius:10px;padding:13px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.2rem;margin-bottom:10px}
.kit{position:sticky;bottom:0;z-index:5;display:flex;gap:7px;overflow-x:auto;background:var(--bg);margin:0 -14px;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);scrollbar-width:none}
.kit::-webkit-scrollbar{display:none}
.tool{flex:none;width:80px;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:6px 3px;font-size:.7rem;font-weight:600;line-height:1.1;text-align:center;hyphens:auto}
.tool svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--olive)}
.tool.sel{background:var(--olive);border-color:var(--olive);color:var(--panel)}
.tool.sel svg{color:var(--panel)}
.hint{font-size:.85rem;color:var(--muted);margin:0 0 6px}
.figs2{display:flex;gap:6px;justify-content:center}
.figs2 .fig{width:120px}
.tag{font-size:.75rem;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:4px;white-space:nowrap}
.tag.found{background:var(--ok);color:#fff}.tag.miss{background:var(--blood);color:#fff}
.tracker2{display:flex;gap:10px;margin:6px 0 8px;justify-content:space-between}
.tracker2 .grp{display:flex;flex-direction:column;gap:2px;flex:var(--n)}
.tracker2 .gl{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:.72rem;color:var(--muted)}
.tracker2 .gl.on{color:var(--ink)}
.tracker2 .ls{display:flex;gap:3px}
.tracker2 .ls div{flex:1;font-family:"Saira Stencil One",Impact,sans-serif;font-size:1.15rem;line-height:1.5;text-align:center;border:2px solid var(--line);border-radius:6px;color:var(--line);transition:background .3s,color .3s}
.tracker2 .ls div.now{border-color:var(--c);color:var(--c)}
.tracker2 .ls div.done{background:var(--c);border-color:var(--c);color:#fff;animation:pop .35s}
.curstep{font-size:.9rem;margin:-2px 0 6px}
.curstep b{font-family:"Barlow Condensed",sans-serif;font-size:1rem}
.choice{background:var(--panel);border:2px solid var(--c,var(--olive));border-radius:10px;padding:10px 12px;margin-bottom:10px}
.choice h3{margin:0 0 8px;font-family:"Barlow Condensed",sans-serif;font-size:1.05rem}
.choice .opts{display:grid;gap:7px}
.choice button{background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:11px 12px;text-align:left;font-weight:600;box-shadow:0 2px 0 var(--line)}
.choice button:active{transform:translateY(2px);box-shadow:none}
.choice button:disabled{opacity:.4;text-decoration:line-through}
.choice button.msel{border:2px solid var(--olive);background:color-mix(in srgb,var(--olive) 14%,var(--btn))}
.learn{background:color-mix(in srgb,#F2C94C 16%,var(--panel));border:1px solid #d4ab2c;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:.92rem}
.learn p{margin:0 0 6px}.learn.compact{padding:8px 10px}.learn .tip{font-weight:600}
.lrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lrow button{background:#F2C94C;color:#222;border:0;border-radius:8px;padding:8px 12px;font-weight:700}
.lrow label{display:flex;gap:6px;align-items:center;font-weight:600}
.hintz{animation:hintz 1s ease-in-out infinite}@keyframes hintz{50%{fill-opacity:.05;stroke-opacity:.4}}
.tool.hint,.choice button.hint,.viewbtn.hint{box-shadow:0 0 0 3px #F2C94C;animation:hintp 1s ease-in-out infinite}
@keyframes hintp{50%{box-shadow:0 0 0 6px rgba(242,201,76,.35)}}
.grpt{font-family:"Saira Stencil One",Impact,sans-serif;font-size:1.1rem;margin:10px 0 2px}
.stage{position:relative;overflow:hidden;border-radius:9px;border:1px solid rgba(0,0,0,.25);box-shadow:inset 0 0 18px rgba(0,0,0,.25)}
.env-forest{background:radial-gradient(ellipse at 50% 100%,rgba(0,0,0,.25),transparent 55%),radial-gradient(circle at 15% 20%,#8f955f 0 3px,transparent 4px),radial-gradient(circle at 80% 35%,#7d8452 0 2px,transparent 3px),radial-gradient(circle at 30% 70%,#8a9058 0 2.5px,transparent 3.5px),radial-gradient(circle at 85% 80%,#747b4a 0 3px,transparent 4px),linear-gradient(180deg,#a7a57a,#8a8a5d);background-size:auto,40px 40px,34px 34px,46px 46px,38px 38px,auto}
.env-urban{background:radial-gradient(ellipse at 50% 100%,rgba(0,0,0,.25),transparent 55%),repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 1px,transparent 1px 30px),repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 1px,transparent 1px 44px),linear-gradient(180deg,#aca79c,#8e897f)}
.env-fire{background:radial-gradient(ellipse at 50% 100%,rgba(0,0,0,.3),transparent 55%),radial-gradient(circle at 25% 30%,#9b8d6c 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,#8d7f60 0 2.5px,transparent 3.5px),linear-gradient(180deg,#b3a37f,#8f8061);background-size:auto,36px 36px,44px 44px,auto}
.env-fire::after{content:"";position:absolute;inset:-30%;pointer-events:none;background:radial-gradient(circle at 20% 25%,rgba(70,70,70,.32),transparent 22%),radial-gradient(circle at 65% 15%,rgba(110,110,110,.28),transparent 20%),radial-gradient(circle at 45% 55%,rgba(80,80,80,.18),transparent 28%);animation:smoke 10s ease-in-out infinite alternate}
@keyframes smoke{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
.breath{transform-box:fill-box;transform-origin:50% 90%;animation:breathe var(--br,3.2s) ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.03,1.012)}}
.drip{animation:drip 1.3s ease-in infinite}.drip.d2{animation-delay:.65s}
@keyframes drip{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(16px);opacity:0}}
.bub{transform-box:fill-box;animation:bub 1.6s ease-out infinite}.bub.b2{animation-delay:.8s}
@keyframes bub{0%{transform:translate(0,0) scale(.5);opacity:0}30%{opacity:.9}100%{transform:translate(3px,-9px) scale(1.3);opacity:0}}
.zz{animation:zz 2.4s ease-in-out infinite}@keyframes zz{0%{transform:translate(0,4px);opacity:0}40%{opacity:1}100%{transform:translate(4px,-6px);opacity:0}}
.vein{animation:vein .8s ease-in-out infinite}@keyframes vein{50%{stroke-width:3.4}}
.tqIn .band{transform-box:fill-box;transform-origin:center;animation:band .35s ease-out}@keyframes band{from{transform:scaleX(1.4);opacity:0}}
.wind{transform-box:fill-box;transform-origin:center;animation:wind .8s cubic-bezier(.3,1.4,.5,1)}@keyframes wind{from{transform:rotate(-270deg)}}
.unfold{transform-box:fill-box;transform-origin:50% 0;animation:unfold .8s cubic-bezier(.2,.8,.2,1)}@keyframes unfold{from{transform:scaleY(.04);opacity:.3}}
.slideIn{transform-box:fill-box;transform-origin:center;animation:slideIn .5s ease-out}@keyframes slideIn{from{transform:scaleX(.1);opacity:0}}
.shimmer{animation:shim 2.6s ease-in-out infinite}@keyframes shim{50%{opacity:.15}}
.tap{transform-box:fill-box;transform-origin:center;animation:tap .55s ease-out forwards;fill:none;stroke:#fff;stroke-width:1.6}@keyframes tap{from{transform:scale(.4);opacity:1}to{transform:scale(2.6);opacity:0}}
.snd{background:none;border:1px solid var(--line);border-radius:6px;padding:0 8px;font-size:.95rem;line-height:1.6}
.fig.play{width:176px}
@media (max-width:360px){.scene{grid-template-columns:140px 1fr!important}.fig.play{width:140px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function tone(f,d,type="sine",vol=.15,when=0){if(!SOUND)return;const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+when;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.03)}
function noise(d,vol=.2,freq=2500){if(!SOUND)return;const c=ac();if(!c)return;const b=c.createBuffer(1,Math.floor(c.sampleRate*d),c.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length)*(Math.random()<.3?1:.4);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type="bandpass";f.frequency.value=freq;const g=c.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(c.destination);s.start()}
const SFX={ok:()=>{tone(660,.12,"sine",.12);tone(990,.2,"sine",.1,.09)},bad:()=>{tone(150,.28,"square",.06);tone(110,.3,"square",.05,.05)},

  if(W.some(w=>WL[w.tool]==="M"&&w.rev&&!w.done))return"une hémorragie massive constatée n'est pas contrôlée.";
  const miss=["armR","armL","LR","LL"].filter(l=>!S.exam.has("limb:"+l));
  if(miss.length)return"balayage incomplet, il reste : "+miss.map(l=>LIMBN[l]).join(", ")+".";
  return open_(S,"M").length?"une hémorragie n'est pas contrôlée.":"";
 }
 if(L==="A"){if(!S.exam.has("head"))return"voies aériennes non évaluées : examine la tête.";return open_(S,"A").length?"voies aériennes à sécuriser.":""}
 if(L==="R"){if(!S.exam.has("chestR")&&!S.exam.has("chestL"))return"thorax non examiné.";
  if(!S.exam.has("back")&&!S.exam.has("lowback"))return"dos non examiné : retourne le blessé.";
  return open_(S,"R").length?"un problème respiratoire n'est pas traité.":""}
 if(L==="C"){if(!S.pulse)return"pouls non vérifié : examine un bras.";
  if(S.tqs.length&&!S.marked)return"heure de pose du garrot non notée.";
  return open_(S,"C").length?"bassin à stabiliser.":""}
 if(L==="H")return S.blanket?"":"protège-le de l'hypothermie.";
 if(L==="E")return S.evac?"":"demande l'évacuation.";

 if(L==="rY"){if(!S.yExam)return"examine les yeux (touche la tête).";return open_(S,"rY").length?"protège l'œil blessé.":""}

 if(L==="rN"){if(open_(S,"rN").some(w=>w.rev))return"soins complémentaires à faire (pansement, attelle).";return S.fiche?"":"remplis la fiche de l'avant et surveille."}

const curLetter=()=>ORDER.find(L=>pending(L));

function good(msg,fresh){st.hintOn=false;st.fb="✓ "+msg;st.fbc="good";st.fresh=fresh;flash("good");SFX.ok()}
function tooEarly(L){const c=blocker(L);penal(8,`Trop tôt. Priorité : ${LBL[c]} (${CH(c)}), ${pending(c)}`)}

 if(tool==="belt"||w.tool==="belt")return w.tool==="belt"&&(z==="pelvis"||z==="buttocks");
 if(tool==="pack"||w.tool==="pack"||TORSO.has(w.zone)||w.zone==="head")return w.zone===z;

  if(st.targets.includes(k)&&!st.re.has(k)){st.re.add(k);reMsg="Réévalué : soin en place."}

 const open=L=>W.find(w=>WL[w.tool]===L&&w.rev&&!w.done);
 const act=(w,txt)=>({tool:w.tool,zones:[w.zone==="pelvis"?"pelvis":w.zone],text:txt||(`Outil « ${TN(w.tool)} » sur ${ZN[w.zone]}${w.side==="back"?" (retourne le blessé)":""}.`)});
 if(c==="M"){const w=open("M");if(w)return act(w,w.tool==="pack"?`Zone jonctionnelle : pas de garrot. Outil « Méchage » sur ${ZN[w.zone]}.`:`Hémorragie d'un membre : « Garrot » haut et serré sur ${ZN[w.zone].replace("la jambe","la jambe (ou la cuisse)")}.`);
  const miss=["armR","armL","LR","LL"].filter(l=>!st.exam.has("limb:"+l));
  return{tool:"hands",zones:miss.map(l=>ZK("limb:"+l)),text:"Balayage : outil « Examiner » sur chaque membre en surbrillance. Des blessures peuvent être cachées."}}
 if(c==="A"){if(!st.exam.has("head"))return{tool:"hands",zones:["head"],text:"Outil « Examiner » sur la tête : est-ce qu'il parle, est-ce qu'il respire bruyamment ?"};const w=open("A");return act(w,"Inconscient qui ronfle : « Canule NPA » sur la tête, puis PLS.")}
 if(c==="R"){if(!st.exam.has("chestR")&&!st.exam.has("chestL"))return{tool:"hands",zones:["chestR","chestL"],text:"Outil « Examiner » sur le thorax."};
  if(!st.exam.has("back")&&!st.exam.has("lowback"))return{tool:"hands",zones:["back"],text:"Retourne le blessé (bouton ↻), puis « Examiner » sur le dos : cherche un orifice de sortie."};
  const w=open("R");return act(w,w.tool==="needle"?"Pneumothorax sous tension : « Exsufflation » sur le thorax atteint (d'abord décoller un bord du pansement).":undefined)}
 if(c==="C"){if(!st.pulse)return{tool:"hands",zones:["armR","armL"],text:"Outil « Examiner » sur un bras pour prendre le pouls radial."};
  if(st.tqs.length&&!st.marked)return{tool:"marker",zones:[...new Set(st.tqs.map(q=>ZK("limb:"+q.limb)))],text:"Outil « Feutre » sur un membre garrotté : on note l'heure de pose."};
  return act(open("C"),"Chute + douleur du bassin : « Ceinture pelvienne » sur le bassin.")}
 if(c==="H")return{tool:"blanket",zones:["chestR","chestL","abdomen"],text:"Outil « Couverture » sur le blessé."};
 if(c==="rR"){const m=st.targets.filter(k=>!st.re.has(k));return{tool:"hands",zones:m.map(ZK),text:"Outil « Examiner » sur chaque zone déjà soignée, en surbrillance."}}
 if(c==="rY"){if(!st.yExam)return{tool:"hands",zones:["head"],text:"Outil « Examiner » sur la tête pour vérifier les yeux."};return act(open("rY"),"« Coque oculaire » sur la tête : on protège sans appuyer.")}
 if(c==="rN"){const w=open("rN");if(w)return act(w);return{choice:"fiche",text:"Remplis la fiche de l'avant et surveille le blessé."}}
 return null;
}
/* ---------- panneaux de choix ---------- */
const SAFE_T={sS:"Faire cesser le danger (riposte, neutralisation)",sA:"Évaluer la situation (menaces, engins, dangers)",sF:"Soustraire le blessé au danger (extraction à l'abri)",sE:"Premier bilan : conscience, hémorragie évidente",bad:"Courir le soigner immédiatement"};
function safeOk(k){const f=st.s.fire;return{sS:f?"Supériorité du feu d'abord : la meilleure médecine, c'est de neutraliser la menace.":"Danger écarté : pas de sur-accident.",
 sA:"Situation évaluée : menaces résiduelles, engins, feu, circulation.",sF:f?"Blessé extrait vers un abri.":"Blessé soustrait au danger et installé.",sE:"Premier bilan fait. On enchaîne sur MARCHE."}[k]}
function choose(k){
 st.tap=null;st.fresh=null;st.newW=null;const c=curLetter();
 if(k==="bad"){st.dead.add("bad");penal(10,"Sans sécuriser d'abord, tu risques d'être le deuxième blessé.")}
 else if(["sS","sA","sF","sE"].includes(k)){if(c===k){st.safe.add(k);good(safeOk(k))}else penal(8,`Pas encore. Dans SAFE, la priorité est : ${SAFE_T[c]}.`)}
 else if(k==="UA"||k==="UR"){if(k===st.s.evac){st.evac=true;
   const T=new Set(st.w.filter(w=>w.done&&["M","A","R","C"].includes(WL[w.tool])).map(keyOf));st.tqs.forEach(q=>T.add("limb:"+q.limb));st.targets=[...T];
   good(k==="UA"?"Demande d'évacuation en urgence absolue transmise. En attendant : RYAN.":"Urgence relative : blessé stable, on ne sature pas les moyens d'évacuation. En attendant : RYAN.")}
  else{st.dead.add(k);penal(10,k==="UA"?"Pas de détresse vitale : c'est une urgence relative.":"Hémorragie, détresse ou choc : c'est une urgence absolue.")}}
 else if(k==="yes"||k==="no"){const ok=(k==="yes")===st.s.analg;if(ok){st.analg=true;good(k==="yes"?"Analgésie selon ton protocole et tes compétences : la douleur aggrave le stress et le choc.":"Inconscient : pas d'analgésie, surveillance des voies aériennes.")}
  else{st.dead.add(k);penal(8,k==="yes"?"Il est inconscient : pas d'analgésie.":"Il est conscient et souffre : l'analgésie fait partie des soins.")}}
 else if(k==="fiche"){if(open_(st,"rN").some(w=>w.rev))penal(5,"Termine d'abord les soins complémentaires.");else{st.fiche=true;good("Fiche de l'avant remplie (heures, gestes, constantes). Surveillance jusqu'à l'évacuation.")}}
 after();
}
function panel(){
 const c=curLetter();if(!c)return"";
 const HC=st.H&&st.H.choice;const B=(k,t)=>`<button data-k="${k}" class="${HC===k?"hint":""}" ${st.dead.has(k)?"disabled":""}>${t}</button>`;
 if(c[0]==="s"&&c.length===2)return`<div class="choice" style="--c:var(--ink)"><h3>SAFE : avant de toucher le blessé</h3><div class="opts">${st.safeOpts.filter(k=>!st.safe.has(k)).map(k=>B(k,SAFE_T[k])).join("")}</div></div>`;
 if(c==="E")return`<div class="choice" style="--c:var(--olive)"><h3>E : demande d'évacuation</h3><div class="opts">${B("UA","Urgence absolue")}${B("UR","Urgence relative")}</div></div>`;
 if(c==="rA")return`<div class="choice" style="--c:var(--lC)"><h3>A : analgésie</h3><div class="opts">${B("yes","Analgésie selon protocole")}${B("no","Pas d'analgésie")}</div></div>`;
 if(c==="rN"&&!open_(st,"rN").some(w=>w.rev))return`<div class="choice" style="--c:var(--lH)"><h3>N : nursing</h3><div class="opts">${B("fiche","Remplir la fiche de l'avant et surveiller")}</div></div>`;
 return"";
}

/* ---------- écrans ---------- */
function tracker(){
 const c=curLetter();
 return`<div class="tracker2">${GROUPS.map(([g,ks])=>`<div class="grp" style="--n:${ks.length}"><span class="gl ${ks.includes(c)?"on":""}">${g}</span><div class="ls">${ks.map(k=>`<div class="${!pending(k)&&(!c||ORDER.indexOf(k)<ORDER.indexOf(c))?"done":c===k?"now":""}" style="--c:${LC[k]}" title="${LBL[k]}">${CH(k)}</div>`).join("")}</div></div>`).join("")}</div>
 ${c?`<p class="curstep"><b style="color:${LC[c]}">${CH(c)}</b> ${LBL[c]}</p>`:""}`;
}
function intro(){
 const b=best(),D=mk(SC[0]);
 app.innerHTML=`<div class="hero"><h1 class="big" style="font-size:clamp(2.2rem,11vw,3.2rem)"><span>SAFE</span><span style="color:var(--lM)">MARCHE</span><span style="color:var(--lR)">RYAN</span></h1><div class="stage env-fire">${figure(D,"front")}</div></div>
 <p style="margin-top:10px">Le protocole complet du sauvetage au combat, du premier coup de feu jusqu'à l'évacuation.</p>
 <p class="grpt">SAFE</p><p class="muted">Avant de toucher le blessé : faire cesser le danger, évaluer la situation, soustraire au danger, premier bilan.</p>
 <p class="grpt" style="color:var(--lM)">MARCHE</p><p class="muted">Hémorragie massive, voies aériennes, respiration, choc, hypothermie, évacuation.</p>
 <p class="grpt" style="color:var(--lR)">RYAN</p><p class="muted">En attendant l'évacuation : réévaluation, yeux, analgésie, nursing.</p>
 <p style="margin-top:12px"><strong>Choisis un outil</strong> dans la trousse en bas, puis <strong>touche la zone</strong> sur le mannequin. Fais un vrai balayage et retourne le blessé : certaines blessures sont cachées, et la réévaluation peut en faire apparaître de nouvelles.</p>
 <div class="choice" style="--c:var(--olive);margin-top:14px"><h3>Temps disponible</h3><div class="opts">${Object.entries(MODES).map(([k,m])=>`<button data-m="${k}" class="${MODE===k?"msel":""}"><strong>${MODE===k?"● ":"○ "}${m.t}</strong><br><span class="muted" style="font-weight:500;font-size:.88rem">${m.d}</span></button>`).join("")}</div></div>
 ${b?`<p>Meilleur score : <strong>${b}</strong></p>`:""}
 <button class="primary" id="go">Commencer la série (${SC.length} blessés)</button>
 <p class="note">Outil d'entraînement au raisonnement. Ne remplace pas une formation SC1 / SC2 / TCCC encadrée, ni les protocoles de ton unité.</p>`;
 app.querySelectorAll("[data-m]").forEach(x=>x.onclick=()=>{MODE=x.dataset.m;try{localStorage.setItem("march_mode",MODE)}catch(e){}const y=window.scrollY;intro();window.scrollTo(0,y)});
 document.getElementById("go").onclick=()=>{order=shuffle(SC.map((_,i)=>i));cur=0;total=0;results=[];start()};
}
function start(){
 st=mk(SC[order[cur]]);render();clearInterval(timer);
 timer=setInterval(()=>{const b=open_(st,"M").length>0,r=open_(st,"R").length>0;
  const k=MODES[MODE].k;st.hp-=(b?0.45:r?0.22:0.06)*k;if(b)st.blood=Math.min(60,st.blood+.3*Math.max(k,.25));if(st.hp<=0){st.hp=0;end(false)}else updBar()},250);
}
function updBar(){
 const i=document.querySelector(".bar i");if(!i)return;
 i.style.width=st.hp+"%";i.style.background=st.hp>60?"var(--ok)":st.hp>30?"var(--warn)":"var(--blood)";
 const bpm=Math.round(78+(100-st.hp)*0.9);document.getElementById("bpm").textContent=bpm+" bpm";
 const h=document.querySelector(".heart");if(h)h.style.setProperty("--dur",(60/bpm).toFixed(2)+"s");
 document.querySelectorAll(".stain.grow").forEach(c=>c.setAttribute("r",Math.min(15,+c.dataset.b+st.blood*.13)));
 const now=performance.now();if(SOUND&&now-st.lastBeat>=60000/bpm){st.lastBeat=now;SFX.beat()}
 const p=document.getElementById("pool");if(p){const r=4+st.blood*.22;p.setAttribute("rx",r*1.6);p.setAttribute("ry",Math.max(2,r*.45))}
}
function render(){
 const s=st.s,tool=TOOLS.find(t=>t[0]===st.tool);
 st.H=(st.hintOn||(LEARN()&&AUTO))?hint():null;st.hl=st.H&&st.H.zones||[];
 const needFlip=st.hl.length&&!st.hl.some(z=>(st.view==="back"?ZB:ZF).some(r=>r[0]===z));
 const c0=curLetter();
 app.innerHTML=`<div class="row"><span class="muted">Blessé ${cur+1} / ${SC.length} · ${MODE==="illimite"?"∞":MODES[MODE].t}</span><span class="muted">Erreurs : ${st.err}${st.hints?` · 💡 ${st.hints}`:""} <button class="snd" id="snd" aria-label="Son">${SOUND?"🔊":"🔇"}</button></span></div>
 ${tracker()}
 <div class="vitals">${HEART}<div class="bar"><i></i></div><span class="bpm" id="bpm"></span></div>
 <div class="scene"><div><div class="stage env-${s.env}">${figure(st,st.view,"fig play")}</div><button class="viewbtn ${needFlip?"hint":""}" id="flip">↻ ${st.view==="front"?"Retourner (dos)":"Revenir de face"}</button></div>
  <div class="side"><span class="phase">${s.phase}</span><h2>${s.title}</h2><p class="ctx">${s.ctx}</p>
  <h3>Constatations</h3><ul class="inj">${st.seen.map((i,k)=>{const w=st.w[i];return `<li class="${w.done?"done":""} ${st.newW===i?"new":""}"><span class="badge" style="${w.done?"background:var(--ok)":""}">${w.done?"✓":k+1}</span><span>${w.label}${w.side==="back"?" (dos)":""}</span></li>`}).join("")}
  ${(s.notes||[]).map(n=>`<li><span class="dot">•</span><span>${n}</span></li>`).join("")}</ul></div></div>
 ${panel()}
 ${LEARN()&&c0?`<div class="learn"><p><b style="color:${LC[c0]}">${CH(c0)} · ${LBL[c0]}</b><br>${EXPL[c0]}</p>${st.H?`<p class="tip">💡 ${st.H.text}</p>`:""}<div class="lrow">${AUTO?"":`<button id="hintbtn">💡 Montre-moi</button>`}<label><input type="checkbox" id="auto" ${AUTO?"checked":""}> Aide permanente</label></div></div>`
 :c0?`<div class="learn compact">${st.H?`<p class="tip">💡 ${st.H.text}</p>`:""}<div class="lrow">${st.H?`<span class="muted">Aide utilisée : ${st.hints} (−${HINT_COST*st.hints} pts)</span>`:`<button id="hintbtn">💡 Montre-moi</button><span class="muted">−${HINT_COST} pts, noté au bilan</span>`}</div></div>`:""}
 <div class="fb ${st.fbc}" aria-live="polite">${st.fb||'<span class="muted">Commence par SAFE, puis choisis un outil et touche le mannequin.</span>'}</div>
 <p class="hint">Outil actif : <strong>${tool[1]}</strong></p>
 <div class="kit">${TOOLS.map(t=>`<button class="tool ${st.tool===t[0]?"sel":""} ${st.H&&st.H.tool===t[0]&&st.tool!==t[0]?"hint":""}" data-t="${t[0]}">${icon(t[2])}<span>${t[1]}</span></button>`).join("")}</div>`;
 updBar();
 app.querySelector(".fig.play").onclick=e=>{const z=e.target.getAttribute&&e.target.getAttribute("data-z");if(!z)return;try{const sv=e.currentTarget,pt=sv.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(sv.getScreenCTM().inverse());st.tap={x:+q.x.toFixed(1),y:+q.y.toFixed(1)}}catch(err){}onZone(z)};
 document.getElementById("snd").onclick=()=>{SOUND=!SOUND;try{localStorage.setItem("march_snd",SOUND?"1":"0")}catch(e){}if(SOUND){const c=ac();c&&c.resume&&c.resume();SFX.ok()}st.tap=null;render()};
 document.getElementById("flip").onclick=()=>{st.tap=null;st.view=st.view==="front"?"back":"front";st.fresh=null;st.newW=null;render()};
 app.querySelectorAll(".choice button").forEach(b=>b.onclick=()=>choose(b.dataset.k));
 const hb=document.getElementById("hintbtn");if(hb)hb.onclick=()=>{if(!st.hintOn&&!(LEARN()&&AUTO))st.hints++;st.hintOn=true;st.tap=null;render()};
 const au=document.getElementById("auto");if(au)au.onchange=()=>{AUTO=au.checked;try{localStorage.setItem("march_auto",AUTO?"1":"0")}catch(e){}st.tap=null;render()};
 app.querySelectorAll(".tool").forEach(b=>b.onclick=()=>{st.tap=null;st.tool=b.dataset.t;st.fresh=null;st.newW=null;const sc=app.querySelector(".kit").scrollLeft;render();app.querySelector(".kit").scrollLeft=sc});
}
function end(ok){
 clearInterval(timer);
 const s=st.s,sec=Math.round((Date.now()-st.t0)/1000),hidden=st.w.filter(w=>w.hidden),found=hidden.filter(w=>w.rev).length;
 const pts=LEARN()?0:ok?Math.max(0,Math.round(st.hp*10-st.err*40+(MODES[MODE].k?Math.max(0,Math.round(150/MODES[MODE].k)-sec)*3*MODES[MODE].k:0)+found*100+(st.evSpawned?100:0)-st.hints*HINT_COST)):0;
 total+=pts;results.push({title:s.title,ok,pts,found,hid:hidden.length,hints:st.hints});
 const F=mk(s);F.w=st.w.map(w=>({...w,rev:true,done:ok?true:w.done}));F.seen=F.w.map(w=>w.i);
 F.tqs=st.tqs.map(t=>({...t,fresh:false}));F.marked=st.marked;F.blanket=st.blanket;F.blood=st.blood;F.exam=st.exam;
 const has=t=>s.wounds.some(w=>w.tool===t);
 const steps=[["SAFE",[["sS",s.fire?"Riposter, neutraliser la menace.":"Faire cesser le danger."],["sA","Évaluer la situation."],["sF","Soustraire le blessé au danger."],["sE","Premier bilan."]]],
  ["MARCHE",[["M","Balayage des 4 membres (et sous le gilet), contrôle de chaque hémorragie."],["A","Tête et voies aériennes"+(has("npa")?" : canule + PLS.":".")],["R","Thorax devant ET derrière"+(s.wounds.some(w=>WL[w.tool]==="R")?", traiter chaque plaie.":".")],
   ["C","Pouls radial"+(has("tq")||s.pre?.tqs?", heure des garrots":"")+(has("belt")?", ceinture pelvienne":"")+"."],["H","Isoler du sol et couvrir."],["E","Évacuation en urgence "+(s.evac==="UA"?"absolue.":"relative.")]]],
  ["RYAN",[["rR","Réexaminer chaque soin posé"+(s.event?" : ici, "+s.event.label.toLowerCase()+".":".")],["rY","Examiner les yeux"+(has("shield")?", coque oculaire.":".")],["rA",s.analg?"Analgésie selon protocole.":"Pas d'analgésie (inconscient)."],["rN",(has("splint")?"Attelle. ":"")+(has("dress")?"Pansement compressif. ":"")+"Fiche de l'avant, surveillance."]]]];
 app.innerHTML=`<div class="card"><h2 style="color:${ok?"var(--ok)":"var(--blood)"}">${ok?"Blessé pris en charge":"Blessé perdu"}</h2>
  <p class="muted" style="margin:4px 0 0">${s.title} : ${sec} s, ${st.err} erreur${st.err>1?"s":""}${hidden.length?`, blessures cachées : ${found}/${hidden.length}`:""}${st.hints?`<br><span class="tag" style="background:#F2C94C;color:#222;margin:4px 0 0">💡 Aidé ${st.hints} fois${LEARN()?"":` (−${st.hints*HINT_COST} pts)`}</span>`:""}</p>
  <div class="score">${LEARN()?(ok?"✓":"✗"):pts}</div><div class="figs2"><div class="stage env-${s.env}">${figure(F,"front")}</div><div class="stage env-${s.env}">${figure(F,"back")}</div></div></div>
 <div class="card"><h2>Blessures</h2><ul class="debrief">${F.w.map(w=>`<li><span class="l" style="--c:${LC[WL[w.tool]]}">${CH(WL[w.tool])}</span><span><strong>${w.label}</strong>${w.hidden?`<span class="tag ${st.w[w.i].rev?"found":"miss"}">${st.w[w.i].rev?"cachée, trouvée":"cachée, manquée"}</span>`:""}${w.ev?`<span class="tag found">réévaluation</span>`:""}<br><span class="muted">${w.ok}</span></span></li>`).join("")}</ul></div>
 <div class="card"><h2>La bonne séquence</h2>${steps.map(([g,l])=>`<p class="grpt">${g}</p><ol class="debrief">${l.map(([k,t])=>`<li><span class="l" style="--c:${LC[k]}">${CH(k)}</span><span>${t}</span></li>`).join("")}</ol>`).join("")}</div>
 <button class="primary" id="nx">${cur+1<SC.length?"Blessé suivant":"Voir le bilan"}</button>`;
 window.scrollTo(0,0);
 document.getElementById("nx").onclick=()=>{cur++;cur<SC.length?start():final()};
}
function final(){
 const b=best(),rec=!LEARN()&&total>b;if(rec)best(total);
 const th=results.reduce((a,r)=>a+(r.hints||0),0),saved=results.filter(r=>r.ok).length,hf=results.reduce((a,r)=>a+r.found,0),ht=results.reduce((a,r)=>a+r.hid,0);
 app.innerHTML=`<h1 class="big" style="font-size:3rem;margin-top:14px">Bilan</h1><div class="score">${LEARN()?"":total}</div>
 <p class="muted">Mode ${MODES[MODE].t}. ${saved} / ${results.length} blessés pris en charge, ${hf} / ${ht} blessures cachées trouvées${th?`, aide utilisée ${th} fois`:", sans aide"}. ${LEARN()?"":rec?"Nouveau record.":"Record : "+b}</p>
 <div class="card"><ul class="debrief">${results.map(r=>`<li><span class="l" style="--c:${r.ok?"var(--ok)":"var(--blood)"}">${r.ok?"✓":"✗"}</span><span>${r.title} : ${LEARN()?(r.ok?"pris en charge":"perdu"):r.ok?r.pts+" pts":"perdu"}${r.hints?` · 💡 aidé ${r.hints}×`:""}</span></li>`).join("")}</ul></div>
 <button class="primary" id="re">Rejouer une série</button>`;
 document.getElementById("re").onclick=intro;
}
/* ---------- code d'accès ---------- */
const CODES=["67ed2905"];
const hashCode=s=>{let x=0x811c9dc5;for(const c of s){x^=c.charCodeAt(0);x=Math.imul(x,0x01000193)>>>0}return x.toString(16)};
function unlocked(){try{return CODES.includes(localStorage.getItem("march_key"))}catch(e){return false}}
function gate(){
 app.innerHTML=`<div class="hero"><h1 class="big" style="font-size:clamp(2.2rem,11vw,3.2rem)"><span>SAFE</span><span style="color:var(--lM)">MARCHE</span><span style="color:var(--lR)">RYAN</span></h1><div class="stage env-fire">${figure(mk(SC[0]),"front")}</div></div>
 <div class="card" style="margin-top:16px"><h2>Accès réservé</h2><p class="muted" style="margin:4px 0 10px">Entre le code qui t'a été transmis pour accéder à l'entraînement.</p>
 <input id="code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Code d'accès" aria-label="Code d'accès"
  style="width:100%;font:inherit;font-size:1.2rem;letter-spacing:.08em;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--btn);color:var(--ink)">
 <p id="err" style="color:var(--blood);font-weight:600;min-height:1.4em;margin:8px 0 0"></p>
 <button class="primary" id="unlock">Déverrouiller</button></div>`;
 const inp=document.getElementById("code"),go=()=>{const h=hashCode(inp.value.trim().toUpperCase());
  if(CODES.includes(h)){try{localStorage.setItem("march_key",h)}catch(e){}intro()}
  else{document.getElementById("err").textContent="Code incorrect. Vérifie auprès de la personne qui te l'a envoyé.";flash("bad");buzz();inp.select()}};
 document.getElementById("unlock").onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go()};
}
unlocked()?intro():gate();
</script>
</body>
</html>
